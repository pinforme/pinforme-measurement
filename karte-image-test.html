    const col = i % 3, row = Math.floor(i/3);
    const x = M + col*iw, y = iy + row*ih;
    c.strokeStyle = '#bbb'; c.strokeRect(x, y, iw-8, ih-14);
    c.fillStyle = '#777'; c.font = '28px ' + FONT; c.fillText(f[0], x+18, y+40);
    c.fillStyle = '#111'; c.font = '700 40px ' + FONT; c.fillText(f[1], x+18, y+92);
  });
  const gy = iy + ih*2 + 60;
  c.fillStyle = '#111'; c.font = '700 46px ' + FONT; c.fillText('採寸結果（3回の平均値）', M, gy);
  const gw = W - M*2, gh = H - gy - 190;
  const cw = gw/3, ch = gh/5;
  DATA.cells.forEach((cell, i)=>{
    const col = i % 3, row = Math.floor(i/3);
    const x = M + col*cw, y = gy + 36 + row*ch;
    c.strokeStyle = '#bbb'; c.lineWidth = 2; c.strokeRect(x, y, cw-6, ch-10);
    c.fillStyle = '#111'; c.font = '700 38px ' + FONT; c.fillText(cell[0], x+20, y+52);
    c.fillStyle = '#777'; c.font = '25px ' + FONT; c.fillText(cell[1], x+20, y+92);
    const vals = cell[2].map(v => v === '未測定' ? v : v + ' cm').join(' ／ ');
    c.fillStyle = cell[2][0] === '未測定' ? '#999' : '#111';
    c.font = '700 52px ' + FONT; c.textAlign = 'right';
    c.fillText(vals, x+cw-30, y+ch-36);
    c.textAlign = 'left';
  });
  c.fillStyle = '#777'; c.font = '26px ' + FONT;
  c.fillText('※ このカルテはPINFORMEの採寸記録です。再採寸すると最新の内容に更新されます。（これはテスト画像です）', M, H-70);
  return cv;
}

const status = document.getElementById('status');
document.getElementById('genBtn').addEventListener('click', async ()=>{
  status.textContent = '生成中…';
  try{
    const cv = await renderKarte();
    pngBlob = await new Promise(res => cv.toBlob(res, 'image/png'));
    if(!pngBlob){ status.textContent = '生成に失敗しました（PNG化できませんでした）。'; return; }
    const url = URL.createObjectURL(pngBlob);
    const img = document.getElementById('preview');
    img.src = url; img.style.display = 'block';
    const shareBtn = document.getElementById('shareBtn');
    const dlBtn = document.getElementById('dlBtn');
    dlBtn.disabled = false;
    const file = new File([pngBlob], 'pinforme-karte.png', {type:'image/png'});
    const canShareFiles = !!(navigator.canShare && navigator.canShare({files:[file]}));
    shareBtn.disabled = !canShareFiles;
    status.textContent = '生成できました。サイズ: 2339×1654px ／ ' + Math.round(pngBlob.size/1024) + 'KB\n共有での保存: ' + (canShareFiles ? 'この端末は対応しています' : 'この端末は未対応です（画像を長押しして保存してください）');
    shareBtn.onclick = async ()=>{ try{ await navigator.share({files:[file]}); }catch(e){} };
    dlBtn.onclick = ()=>{ const a = document.createElement('a'); a.href = url; a.download = 'pinforme-karte.png'; a.click(); };
  }catch(e){
    status.textContent = '生成に失敗しました: ' + e.message;
  }
});
</script>
