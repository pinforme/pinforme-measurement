<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PINFORME 採寸ナビ</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:auto;
}

body{
  margin:0;
  background:#f7f7f5;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
    "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  line-height:1.7;
  word-break:normal;
  overflow-wrap:normal;
  line-break:strict;
}

header{
  padding:18px 20px 10px;
  text-align:center;
}

.logo{
  font-size:21px;
  font-weight:800;
  letter-spacing:.12em;
}

.sub{
  margin-top:2px;
  font-size:11px;
  letter-spacing:.08em;
  color:#888;
}

main{
  max-width:600px;
  margin:0 auto;
  padding:16px 20px 110px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:22px 18px;
  box-shadow:0 4px 18px rgba(0,0,0,.05);
}

.title{
  margin:0 0 8px;
  font-size:21px;
  font-weight:800;
  text-align:center;
}

.lead{
  margin:0 0 20px;
  text-align:center;
  color:#777;
  font-size:13px;
}

.notice-card{
  background:#f5f5f3;
  border-radius:14px;
  padding:18px;
  margin-bottom:20px;
}

.notice-title{
  font-size:16px;
  font-weight:800;
  margin-bottom:8px;
}

.notice-item{
  font-size:13.5px;
  line-height:1.85;
  padding:10px 0;
  border-top:1px solid #ddd;
  overflow-wrap:normal;
  word-break:normal;
  line-break:strict;
}

.notice-item:first-of-type{
  border-top:none;
}

.check{
  display:flex;
  align-items:flex-start;
  gap:10px;
  margin:18px 2px;
  font-size:13px;
}

.check input{
  width:20px;
  height:20px;
  margin-top:2px;
  flex:none;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px 16px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:#222;
  color:#fff;
}

.primary:disabled{
  background:#ccc;
  color:#fff;
}

.secondary{
  background:#eee;
  color:#333;
}

.nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:rgba(247,247,245,.96);
  backdrop-filter:blur(12px);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  display:flex;
  gap:10px;
  z-index:20;
}

.nav button{
  flex:1;
}

.progress{
  height:4px;
  background:#e5e5e5;
  border-radius:99px;
  margin:0 0 18px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  background:#222;
  transition:width .25s ease;
}

.item-number{
  text-align:center;
  font-size:12px;
  color:#999;
  margin-bottom:3px;
}

.item-title{
  text-align:center;
  font-size:22px;
  font-weight:800;
  margin:0 0 16px;
}

.desc{
  font-size:14px;
  line-height:1.9;
  margin:0 0 22px;
  color:#444;
  word-break:normal;
  overflow-wrap:normal;
  line-break:strict;
}

/*
  文章を「意味のまとまり」で扱うための設定。
  短いまとまりは途中でバラバラになりにくくする。
*/
.phrase{
  display:inline;
}

.measure-box{
  background:#f7f7f5;
  border-radius:14px;
  padding:14px;
  margin-top:12px;
}

.measure-label{
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.measure-input{
  width:100%;
  height:48px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  padding:0 12px;
  font-size:18px;
  text-align:center;
}

.unit{
  text-align:center;
  font-size:11px;
  color:#888;
  margin-top:4px;
}

.average{
  margin-top:16px;
  padding:13px;
  background:#fff;
  border:1px solid #eee;
  border-radius:12px;
  text-align:center;
  font-size:13px;
}

.average strong{
  display:block;
  font-size:22px;
  margin-top:2px;
}

.photo-area{
  text-align:center;
  margin-bottom:20px;
}

.photo-preview{
  width:180px;
  height:180px;
  margin:0 auto 12px;
  border-radius:16px;
  background:#f1f1ef;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  color:#aaa;
  font-size:13px;
}

.photo-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.photo-button{
  width:auto;
  display:inline-block;
  padding:10px 18px;
  background:#eee;
  font-size:13px;
}

.form-group{
  margin-bottom:16px;
}

.form-label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}

input[type="text"],
input[type="date"],
input[type="number"],
select{
  width:100%;
  height:46px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  padding:0 12px;
  font-size:15px;
}

.sex-row{
  display:flex;
  gap:10px;
}

.sex-row label{
  flex:1;
}

.sex-row input{
  display:none;
}

.sex-row span{
  display:block;
  text-align:center;
  padding:12px;
  background:#f3f3f1;
  border-radius:10px;
  font-size:14px;
}

.sex-row input:checked + span{
  background:#222;
  color:#fff;
}

.thanks{
  text-align:center;
  padding:20px 4px 10px;
}

.heart{
  font-size:42px;
  margin-bottom:4px;
}

.thanks-logo{
  font-size:18px;
  font-weight:800;
  letter-spacing:.12em;
  margin-bottom:25px;
}

.thanks-title{
  font-size:23px;
  font-weight:800;
  margin-bottom:14px;
}

.thanks-text{
  font-size:13.5px;
  line-height:1.9;
  color:#555;
  margin-bottom:22px;
}

.result-head{
  text-align:center;
  margin-bottom:20px;
}

.result-photo{
  width:130px;
  height:130px;
  border-radius:16px;
  overflow:hidden;
  margin:0 auto 14px;
  background:#eee;
}

.result-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info-summary{
  background:#f6f6f4;
  border-radius:14px;
  padding:14px;
  margin-bottom:20px;
}

.info-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:7px 0;
  border-bottom:1px solid #ddd;
  font-size:13px;
}

.info-row:last-child{
  border-bottom:none;
}

.info-row span:first-child{
  color:#888;
}

.result-item{
  padding:16px 0;
  border-top:1px solid #eee;
}

.result-item-title{
  font-size:15px;
  font-weight:800;
  margin-bottom:5px;
}

.result-desc{
  font-size:12.5px;
  line-height:1.8;
  color:#666;
  margin-bottom:10px;
}

.result-values{
  display:grid;
  gap:6px;
}

.result-value{
  display:flex;
  justify-content:space-between;
  background:#f7f7f5;
  border-radius:9px;
  padding:8px 10px;
  font-size:12px;
}

.result-average{
  margin-top:7px;
  font-weight:800;
  text-align:right;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <div class="logo">PINFORME</div>
  <div class="sub">MEASUREMENT NAVIGATION</div>
</header>

<main id="app"></main>

<div class="nav">
  <button id="back" class="secondary">← 戻る</button>
  <button id="next" class="primary">次へ →</button>
</div>

<script>

const items = [

  {
    title:"首まわり（首の付け根）",
    desc:[
      "姿勢を正した時にちょうど首から胴体に変わる瞬間部分の毛並みが変わる所があります。"
    ],
    locations:["首の付け根を一周"]
  },

  {
    title:"胴まわり",
    desc:[
      "一番胸が張っているポイントで測ります。",
      "大体前脚の脇あたりから2cmから3cm後ろへ行った辺りになります。"
    ],
    locations:["胸が一番張っている部分を一周"]
  },

  {
    title:"ウェスト",
    desc:[
      "胴体で一番細い部分を一周測ります。"
    ],
    locations:["一番細い部分を一周"]
  },

  {
    title:"着丈",
    desc:[
      "首まわりを測った位置から尻尾の付け根までを測ります。",
      "尻尾は軽く持ち上げますと、首まわり同様に毛並みが変わるラインが薄っすら見えますのでそのラインまでを測ります。"
    ],
    locations:["首まわりの位置 → 尻尾の付け根"]
  },

  {
    title:"前身頃",
    desc:[
      "首まわりを測った位置からお腹部分を覆いかぶせてあげたい部分までを測ります。"
    ],
    locations:["首まわりの位置 → お腹側"]
  },

  {
    title:"前脚の太さ",
    desc:[
      "太いところと細いところを測ります。",
      "服を作る時の目安になります。"
    ],
    locations:["太い部分","細い部分"]
  },

  {
    title:"後脚の太さ",
    desc:[
      "太いところと細いところを測ります。",
      "服を作る時の目安になります。"
    ],
    locations:["太い部分","細い部分"]
  },

  {
    title:"前脚の長さ",
    desc:[
      "脇から関節ごとに地面までを測ります。",
      "服を作る時の目安になります。"
    ],
    locations:["脇 → 肘","肘 → 手首","手首 → 地面"]
  },

  {
    title:"後脚の長さ",
    desc:[
      "測るポイントは❼の測ったラインからになります。",
      "内側でズボンが止まるポイントとなりますのでそこからスタートします。",
      "関節ごとに地面までを測ります。",
      "服を作る時の目安になります。"
    ],
    locations:["❼で測ったライン → 膝","膝 → 足首","足首 → 地面"]
  },

  {
    title:"首の長さ（ネック）",
    desc:[
      "首まわりを測った位置から後頭部に入る手前までの長さでネックデザインを決める際に参考になります。"
    ],
    locations:["首まわりの位置 → 後頭部手前"]
  },

  {
    title:"首の長さ（スヌード）",
    desc:[
      "首まわりを測った位置から額までの長さでスヌードを測る際に参考になります。"
    ],
    locations:["首まわりの位置 → 額"]
  },

  {
    title:"頭周り",
    desc:[
      "額から一周測ります。",
      "首まわりより頭まわりの方が大きい場合があります。",
      "お洋服を着せる際は頭から着せますので、密かに重要ポイントとなります。"
    ],
    locations:["額を通って頭を一周"]
  },

  {
    title:"前脚の幅",
    desc:[
      "犬を前から見たときの前脚の脚と脚の間の幅です。",
      "体格の差や骨格の差や犬種にもより異なります。"
    ],
    locations:["左右の前脚の間"]
  },

  {
    title:"首の真ん中",
    desc:[
      "首の中でも一番細い部分を測ります。"
    ],
    locations:["首の一番細い部分を一周"]
  },

  {
    title:"尻尾の太さ",
    desc:[
      "付け根の一番太い部分を測ります。"
    ],
    locations:["尻尾の付け根の一番太い部分を一周"]
  }

];


const points = [
  "わんちゃんがリラックスした状態で測定してください。",
  "メジャーは体に沿わせ、きつすぎず、ゆるすぎないように測ってください。",
  "毛の長さによって数値が変わるため、できるだけ毛をおさえた状態で測定してください。",
  "分からない場合は、無理に測らず、空欄のままで構いません。"
];


let step = 0;

let dogInfo = {
  owner:"",
  name:"",
  sex:"",
  birth:"",
  weight:"",
  photo:""
};

let values = {};


function scrollTop(){
  window.scrollTo({
    top:0,
    left:0,
    behavior:"instant"
  });
}


function progressPercent(){

  const total = items.length + 4;

  return ((step + 1) / total) * 100;

}


function render(){

  const app = document.getElementById("app");

  if(step === 0){
    app.innerHTML = renderPoints();
  }
  else if(step === 1){
    app.innerHTML = renderInfo();
  }
  else if(step >= 2 && step <= items.length + 1){
    app.innerHTML = renderMeasure(step - 2);
  }
  else if(step === items.length + 2){
    app.innerHTML = renderThanks();
  }
  else{
    app.innerHTML = renderFinish();
  }

  updateButtons();

  scrollTop();

}


function renderPoints(){

  return `

  <div class="progress">
    <div class="progress-bar" style="width:${progressPercent()}%"></div>
  </div>

  <div class="card">

    <h1 class="title">採寸前に</h1>

    <p class="lead">大切なポイントをご確認ください</p>

    <div class="notice-card">

      <div class="notice-title">大切なポイント</div>

      ${points.map((p,i)=>`

        <div class="notice-item">
          ${i+1}. ${p}
        </div>

      `).join("")}

    </div>

    <label class="check">

      <input
        type="checkbox"
        id="agree"
        ${localStorage.getItem("pinforme_agree")==="1" ? "checked" : ""}
      >

      <span>
        上記の内容を確認しました
      </span>

    </label>

    <button
      class="primary"
      id="agreeButton"
      ${localStorage.getItem("pinforme_agree")==="1" ? "" : "disabled"}
    >
      採寸を始める →
    </button>

  </div>

  `;

}


function renderInfo(){

  return `

  <div class="progress">
    <div class="progress-bar" style="width:${progressPercent()}%"></div>
  </div>

  <div class="card">

    <h1 class="title">わんちゃん情報</h1>

    <p class="lead">採寸するわんちゃんの情報を入力してください</p>

    <div class="photo-area">

      <div class="photo-preview" id="photoPreview">

        ${
          dogInfo.photo
          ? `<img src="${dogInfo.photo}" alt="わんちゃんの写真">`
          : `写真`
        }

      </div>

      <label class="photo-button">

        写真を変更

        <input
          type="file"
          id="photoInput"
          accept="image/*"
          style="display:none"
        >

      </label>

    </div>


    <div class="notice-card">

      <div class="notice-title">採寸時の注意点</div>

      <div class="notice-item">
        わんちゃんがリラックスした状態で測定してください。
      </div>

      <div class="notice-item">
        メジャーは体に沿わせ、きつすぎず、ゆるすぎないように測ってください。
      </div>

      <div class="notice-item">
        毛の長さによって数値が変わるため、できるだけ毛をおさえた状態で測定してください。
      </div>

      <div class="notice-item">
        分からない場合は、無理に測らず、空欄のままで構いません。
      </div>

    </div>


    <div class="form-group">

      <label class="form-label">飼い主様のお名前</label>

      <input
        type="text"
        id="owner"
        value="${dogInfo.owner}"
        placeholder="お名前"
      >

    </div>


    <div class="form-group">

      <label class="form-label">わんちゃんのお名前</label>

      <input
        type="text"
        id="dogName"
        value="${dogInfo.name}"
        placeholder="わんちゃんのお名前"
      >

    </div>


    <div class="form-group">

      <label class="form-label">性別</label>

      <div class="sex-row">

        <label>

          <input
            type="radio"
            name="sex"
            value="男の子"
            ${dogInfo.sex==="男の子" ? "checked" : ""}
          >

          <span>男の子</span>

        </label>


        <label>

          <input
            type="radio"
            name="sex"
            value="女の子"
            ${dogInfo.sex==="女の子" ? "checked" : ""}
          >

          <span>女の子</span>

        </label>

      </div>

    </div>


    <div class="form-group">

      <label class="form-label">生年月日</label>

      <input
        type="date"
        id="birth"
        value="${dogInfo.birth}"
      >

    </div>


    <div class="form-group">

      <label class="form-label">体重</label>

      <input
        type="number"
        id="weight"
        value="${dogInfo.weight}"
        placeholder="例：4.5"
        step="0.1"
      >

    </div>

  </div>

  `;

}


function renderMeasure(index){

  const item = items[index];

  const current = values[index] || [];

  return `

  <div class="progress">
    <div
      class="progress-bar"
      style="width:${progressPercent()}%"
    ></div>
  </div>


  <div class="card">

    <div class="item-number">
      ${index + 1} / ${items.length}
    </div>

    <h1 class="item-title">
      ${item.title}
    </h1>


    <p class="desc">

      ${item.desc.map((text,i)=>{

        return `
          <span class="phrase">${text}</span>
          ${i < item.desc.length-1 ? "<br><br>" : ""}
        `;

      }).join("")}

    </p>


    ${item.locations.map((location,i)=>`

      <div class="measure-box">

        <div class="measure-label">
          ${location}
        </div>

        <input
          class="measure-input"
          type="number"
          inputmode="decimal"
          step="0.1"
          min="0"
          data-index="${i}"
          value="${current[i] ?? ""}"
          placeholder="0.0"
        >

        <div class="unit">cm</div>

      </div>

    `).join("")}


    ${
      item.locations.length > 1
      ? `

      <div class="average">

        平均値

        <strong id="average">
          ${calculateAverage(current)}
        </strong>

        cm

      </div>

      `
      : ""
    }

  </div>

  `;

}


function calculateAverage(arr){

  const nums = arr
    .filter(v=>v !== "" && v !== null && v !== undefined)
    .map(Number)
    .filter(v=>!isNaN(v));

  if(!nums.length){
    return "—";
  }

  const avg =
    nums.reduce((a,b)=>a+b,0) / nums.length;

  return avg.toFixed(1);

}


function renderThanks(){

  return `

  <div class="progress">
    <div class="progress-bar" style="width:100%"></div>
  </div>

  <div class="card">

    <div class="thanks">

      <div class="heart">♡</div>

      <div class="thanks-logo">PINFORME</div>

      <div class="thanks-title">
        採寸ありがとうございました
      </div>

      <div class="thanks-text">

        最後まで採寸にご協力いただき、ありがとうございます。<br><br>

        いただいた採寸結果をもとに、<br>
        わんちゃんにより良いフィットのお洋服を<br>
        お届けできるよう活用させていただきます。

      </div>


      <div class="notice-card">

        <div class="notice-title">
          採寸結果について
        </div>

        <div class="notice-item">
          次の画面で、今回入力した採寸結果をご確認いただけます。
        </div>

      </div>


      <button
        class="primary"
        id="showResult"
      >
        採寸結果を見る →
      </button>

    </div>

  </div>

  `;

}


function renderFinish(){

  return `

  <div class="progress">
    <div class="progress-bar" style="width:100%"></div>
  </div>


  <div class="card">

    <div class="result-head">

      ${
        dogInfo.photo

        ? `

        <div class="result-photo">
          <img src="${dogInfo.photo}" alt="わんちゃんの写真">
        </div>

        `

        : ""
      }


      <h1 class="title">
        採寸結果
      </h1>

      <p class="lead">
        ご入力いただいた内容です
      </p>

    </div>


    <div class="info-summary">

      ${
        dogInfo.owner
        ? `
        <div class="info-row">
          <span>飼い主様</span>
          <strong>${escapeHtml(dogInfo.owner)}</strong>
        </div>
        `
        : ""
      }


      ${
        dogInfo.name
        ? `
        <div class="info-row">
          <span>お名前</span>
          <strong>${escapeHtml(dogInfo.name)}</strong>
        </div>
        `
        : ""
      }


      ${
        dogInfo.sex
        ? `
        <div class="info-row">
          <span>性別</span>
          <strong>${escapeHtml(dogInfo.sex)}</strong>
        </div>
        `
        : ""
      }


      ${
        dogInfo.birth
        ? `
        <div class="info-row">
          <span>生年月日</span>
          <strong>${escapeHtml(dogInfo.birth)}</strong>
        </div>
        `
        : ""
      }


      ${
        dogInfo.weight
        ? `
        <div class="info-row">
          <span>体重</span>
          <strong>${escapeHtml(dogInfo.weight)} kg</strong>
        </div>
        `
        : ""
      }

    </div>


    ${items.map((item,index)=>{

      const arr = values[index] || [];

      return `

      <div class="result-item">

        <div class="result-item-title">
          ${index + 1}. ${item.title}
        </div>


        <div class="result-desc">

          ${item.desc.map(text=>`
            <span class="phrase">${text}</span><br>
          `).join("")}

        </div>


        <div class="result-values">

          ${item.locations.map((location,i)=>`

            <div class="result-value">

              <span>${location}</span>

              <strong>
                ${
                  arr[i] !== undefined &&
                  arr[i] !== ""
                  ? `${arr[i]} cm`
                  : "—"
                }
              </strong>

            </div>

          `).join("")}

        </div>


        ${
          item.locations.length > 1
          ? `

          <div class="result-average">
            平均：${calculateAverage(arr)} cm
          </div>

          `
          : ""
        }

      </div>

      `;

    }).join("")}


    <button
      class="secondary"
      id="restart"
      style="margin-top:20px"
    >
      最初に戻る
    </button>

  </div>

  `;

}


function escapeHtml(str){

  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function updateButtons(){

  const back = document.getElementById("back");
  const next = document.getElementById("next");

  back.disabled = false;
  next.style.display = "block";


  if(step === 0){

    back.disabled = true;
    next.style.display = "none";

    const agree =
      document.getElementById("agree");

    const agreeButton =
      document.getElementById("agreeButton");

    if(agree && agreeButton){

      agree.addEventListener("change",()=>{

        agreeButton.disabled =
          !agree.checked;

      });


      agreeButton.addEventListener("click",()=>{

        if(!agree.checked) return;

        localStorage.setItem(
          "pinforme_agree",
          "1"
        );

        step = 1;

        render();

      });

    }

  }


  if(step === 1){

    next.textContent = "採寸を始める →";

  }


  if(step >= 2 && step <= items.length + 1){

    next.textContent =
      step === items.length + 1
      ? "採寸完了 →"
      : "次へ →";

  }


  if(step === items.length + 2){

    next.style.display = "none";

  }


  if(step === items.length + 3){

    next.textContent = "最初に戻る";

  }

}


document.getElementById("back").addEventListener("click",()=>{

  if(step === 0){
    return;
  }


  if(step === 1){

    saveInfo();

    step = 0;

    render();

    return;

  }


  if(step === items.length + 2){

    step--;

    render();

    return;

  }


  if(step === items.length + 3){

    step--;

    render();

    return;

  }


  saveCurrentMeasure();

  step--;

  render();

});


document.getElementById("next").addEventListener("click",()=>{

  if(step === 1){

    saveInfo();

    step++;

    render();

    return;

  }


  if(step >= 2 && step <= items.length + 1){

    saveCurrentMeasure();

    step++;

    render();

    return;

  }


  if(step === items.length + 3){

    resetAll();

    step = 0;

    render();

  }

});


function saveInfo(){

  const owner =
    document.getElementById("owner");

  const dogName =
    document.getElementById("dogName");

  const birth =
    document.getElementById("birth");

  const weight =
    document.getElementById("weight");


  dogInfo.owner =
    owner ? owner.value : dogInfo.owner;

  dogInfo.name =
    dogName ? dogName.value : dogInfo.name;

  dogInfo.birth =
    birth ? birth.value : dogInfo.birth;

  dogInfo.weight =
    weight ? weight.value : dogInfo.weight;


  const sex =
    document.querySelector(
      'input[name="sex"]:checked'
    );

  dogInfo.sex =
    sex ? sex.value : dogInfo.sex;

}


function saveCurrentMeasure(){

  const index = step - 2;

  const inputs =
    document.querySelectorAll(
      ".measure-input"
    );

  values[index] =
    Array.from(inputs).map(
      input=>input.value
    );

}


document.addEventListener("input",(e)=>{

  if(e.target.classList.contains("measure-input")){

    const index =
      step - 2;

    const inputs =
      document.querySelectorAll(".measure-input");

    values[index] =
      Array.from(inputs).map(
        input=>input.value
      );


    const average =
      document.getElementById("average");

    if(average){

      average.textContent =
        calculateAverage(values[index]);

    }

  }

});


document.addEventListener("change",(e)=>{

  if(e.target.id === "photoInput"){

    const file =
      e.target.files[0];

    if(!file) return;


    const reader =
      new FileReader();


    reader.onload = function(){

      dogInfo.photo =
        reader.result;


      const preview =
        document.getElementById("photoPreview");

      if(preview){

        preview.innerHTML =
          `<img src="${dogInfo.photo}" alt="わんちゃんの写真">`;

      }

    };


    reader.readAsDataURL(file);

  }

});


document.addEventListener("click",(e)=>{

  if(e.target.id === "showResult"){

    step =
      items.length + 3;

    render();

  }


  if(e.target.id === "restart"){

    resetAll();

    step = 0;

    render();

  }

});


function resetAll(){

  dogInfo = {
    owner:"",
    name:"",
    sex:"",
    birth:"",
    weight:"",
    photo:""
  };

  values = {};

}


render();

</script>

</body>
</html>
