<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">

<title>PINFORME 採寸ナビ</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  max-width:100%;
  margin:0;
  padding:0;
  overflow-x:hidden;
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Hiragino Sans",
    "Yu Gothic",
    sans-serif;
  background:#f7f7f5;
  color:#222;
  line-height:1.7;
}

button,
input,
select{
  font:inherit;
  max-width:100%;
  min-width:0;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:520px;
  min-width:0;
  min-height:100vh;
  margin:0 auto;
  background:#fff;
  overflow-x:hidden;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#fff;
  border-bottom:1px solid #eee;
  padding:14px 18px 12px;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.brand{
  font-size:15px;
  font-weight:700;
  letter-spacing:.14em;
}

.page-number{
  font-size:12px;
  color:#888;
}

.progress{
  height:3px;
  background:#eee;
  margin-top:10px;
  border-radius:10px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  background:#222;
  transition:width .25s ease;
}

main{
  width:100%;
  min-width:0;
  overflow-x:hidden;
  padding:24px 20px 110px;
}

h1{
  font-size:25px;
  line-height:1.4;
  margin:0 0 10px;
  letter-spacing:.03em;
}

h2{
  font-size:19px;
  line-height:1.5;
  margin:0 0 14px;
}

.lead{
  color:#666;
  font-size:14px;
  margin:0 0 24px;
}

.card{
  background:#fafafa;
  border:1px solid #eee;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
}

.point-card{
  background:#fff;
  border:1px solid #e9e9e9;
  border-radius:14px;
  padding:16px;
  margin-bottom:12px;
}

.point-title{
  font-weight:700;
  font-size:15px;
  margin-bottom:7px;
}

.point-text{
  font-size:13px;
  line-height:1.8;
  color:#444;
  white-space:pre-line;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin:0 0 7px;
}

input,
select{
  display:block;
  width:100%;
  max-width:100%;
  min-width:0;
  height:50px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  padding:0 14px;
  outline:none;
}

input:focus,
select:focus{
  border-color:#222;
}

input[type="date"]{
  -webkit-appearance:none;
  appearance:none;
  display:block;
  width:100%;
  max-width:100%;
  min-width:0;
  height:50px;
  padding:14px;
}

.field{
  margin-bottom:18px;
}

.photo-box{
  width:100%;
  aspect-ratio:1 / 1;
  border:1px dashed #ccc;
  border-radius:14px;
  overflow:hidden;
  background:#f7f7f7;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
}

.photo-box img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.photo-placeholder{
  color:#999;
  font-size:13px;
  text-align:center;
  padding:20px;
}

.small-button{
  width:100%;
  height:46px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:10px;
  font-size:13px;
}

.measure-header{
  margin-bottom:20px;
}

.measure-number{
  font-size:12px;
  color:#888;
  letter-spacing:.1em;
  margin-bottom:5px;
}

.measure-title{
  font-size:24px;
  font-weight:700;
  line-height:1.4;
  margin-bottom:10px;
}

.measure-description{
  font-size:14px;
  color:#555;
  line-height:1.9;
  white-space:pre-line;
}

.location-card{
  border:1px solid #e7e7e7;
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
  background:#fff;
}

.location-title{
  font-size:15px;
  font-weight:700;
  margin-bottom:12px;
  white-space:pre-line;
}

.measure-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.measure-input{
  min-width:0;
}

.measure-input input{
  text-align:center;
  padding:0 6px;
}

.measure-number-label{
  font-size:11px;
  color:#888;
  text-align:center;
  margin-bottom:5px;
}

.measure-unit{
  text-align:center;
  font-size:12px;
  color:#555;
  margin-top:5px;
}

.average{
  margin-top:12px;
  padding:10px 12px;
  background:#f7f7f5;
  border-radius:9px;
  font-size:12px;
  color:#555;
  line-height:1.6;
}

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:520px;
  z-index:30;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);
  border-top:1px solid #eee;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
}

.nav-inner{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.nav-button{
  height:50px;
  border-radius:11px;
  border:1px solid #ddd;
  background:#fff;
  font-weight:700;
}

.nav-button.primary{
  background:#222;
  color:#fff;
  border-color:#222;
}

.nav-button:disabled{
  opacity:.35;
}

.agree-box{
  display:flex;
  align-items:flex-start;
  gap:10px;
  margin-top:20px;
  font-size:13px;
}

.agree-box input{
  width:20px;
  height:20px;
  flex:none;
  margin-top:2px;
}

.agree-box label{
  margin:0;
  font-weight:400;
}

.finish{
  text-align:center;
  padding-top:30px;
}

.finish-mark{
  font-size:30px;
  margin-bottom:12px;
}

.finish-brand{
  font-size:16px;
  font-weight:700;
  letter-spacing:.18em;
  margin-bottom:24px;
}

.result-card{
  border:1px solid #eee;
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
}

.result-photo{
  width:100%;
  aspect-ratio:1 / 1;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:18px;
}

.result-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.result-info{
  display:grid;
  grid-template-columns:90px 1fr;
  gap:8px 12px;
  font-size:13px;
}

.result-label{
  color:#888;
}

.result-value{
  font-weight:600;
  overflow-wrap:anywhere;
}

.result-location{
  border-top:1px solid #eee;
  margin-top:14px;
  padding-top:12px;
}

.result-location-title{
  font-weight:700;
  font-size:13px;
  margin-bottom:5px;
}

.result-value-big{
  font-size:18px;
  font-weight:700;
}

.note{
  font-size:12px;
  color:#888;
  line-height:1.7;
  margin-top:20px;
}

@media (max-width:360px){

  main{
    padding-left:16px;
    padding-right:16px;
  }

  .measure-row{
    gap:5px;
  }

  .measure-input input{
    padding:0 3px;
  }

  .measure-number-label{
    font-size:10px;
  }

}
</style>
</head>

<body>

<div class="app">

<header>

  <div class="header-row">

    <div class="brand">
      PINFORME
    </div>

    <div
      class="page-number"
      id="pageNumber">
    </div>

  </div>

  <div class="progress">

    <div
      class="progress-bar"
      id="progressBar">
    </div>

  </div>

</header>


<main id="main"></main>


<div class="bottom-nav">

  <div class="nav-inner">

    <button
      class="nav-button"
      id="backButton">
      戻る
    </button>

    <button
      class="nav-button primary"
      id="nextButton">
      次へ
    </button>

  </div>

</div>

</div>


<script>

/* =========================================================
   15項目
========================================================= */

const items = [

  {
    title:"首まわり（首の付け根）",
    description:
`姿勢を正した時にちょうど首から胴体に変わる瞬間部分
の毛並みが変わる所があります。`,
    locations:[
      "首の付け根"
    ]
  },

  {
    title:"胴まわり",
    description:
`一番胸が張っているポイントで測ります。
大体前脚の脇あたりから2cmから3cm後ろへ行った辺りに
なります。`,
    locations:[
      "胴まわり"
    ]
  },

  {
    title:"ウェスト",
    description:
`胴体で一番細い部分を一周測ります。`,
    locations:[
      "ウェスト"
    ]
  },

  {
    title:"着丈",
    description:
`首まわりを測った位置から尻尾の付け根までを測ります。尻尾は軽く持ち上げますと、首まわり同様に毛並みが
変わるラインが薄っすら見えますのでそのラインまでを
測ります。`,
    locations:[
      "首の付け根 → 尻尾の付け根"
    ]
  },

  {
    title:"前身頃",
    description:
`首まわりを測った位置からお腹部分を多いかぶせて
あげたい部分までを測ります。`,
    locations:[
      "首の付け根 → お腹部分"
    ]
  },

  {
    title:"前脚の太さ",
    description:
`太いところと細いところを測ります。
服を作る時の目安になります。`,
    locations:[
      "太いところ",
      "細いところ"
    ]
  },

  {
    title:"後脚の太さ",
    description:
`太いところと細いところを測ります。
服を作る時の目安になります。`,
    locations:[
      "太いところ",
      "細いところ"
    ]
  },

  {
    title:"前脚の長さ",
    description:
`脇から関節ごとに地面までを測ります。
服を作る時の目安になります。`,
    locations:[
      "脇 → 肘",
      "肘 → 手首",
      "手首 → 地面"
    ]
  },

  {
    title:"後脚の長さ",
    description:
`測るポイントは❼の測ったラインからになります。
内側でズボンが止まるポイントとなりますのでそこから
スタートします。関節ごとに地面までを測ります。
服を作る時の目安になります。`,
    locations:[
      "❼で測ったライン → 膝",
      "膝 → 足首",
      "足首 → 地面"
    ]
  },

  {
    title:"首の長さ(ネック)",
    description:
`首まわりを測った位置から後頭部に入る手前までの長さ
でネックデザインを決める際に参考にないます。`,
    locations:[
      "首の付け根 → 後頭部手前"
    ]
  },

  {
    title:"首の長さ(スヌーズ)",
    description:
`首まわりを測った位置から額までの長さでスヌードを測る
際に参考になります。`,
    locations:[
      "首の付け根 → 額"
    ]
  },

  {
    title:"頭周り",
    description:
`額から一周測ります。
首まわりより頭まわりの方が大きい場合があります。
お洋服を着せる際は頭から着せますので、密かに重要
ポイントとなります。`,
    locations:[
      "頭周り"
    ]
  },

  {
    title:"前脚の幅",
    description:
`犬を前から見たときの前脚の脚と脚の間の幅です。
体格の差や骨格の差や犬種にもより異なります。`,
    locations:[
      "前脚と前脚の間"
    ]
  },

  {
    title:"首の真ん中",
    description:
`首の中でも一番細い部分を測ります`,
    locations:[
      "首の一番細い部分"
    ]
  },

  {
    title:"尻尾の太さ",
    description:
`付け根の一番太い部分を測ります`,
    locations:[
      "尻尾の付け根"
    ]
  }

];


/* =========================================================
   採寸前・大切な6つのポイント
========================================================= */

const points = [

  {
    title:"❶ 採寸は最低3回は測る事",
    text:
`犬は動きますので、一度の採寸では確かな数字ではありません。できるだけ同じ場所を最低3回測り、安定した数値を確認しましょう。`
  },

  {
    title:"❷ 測る際の立たせている場所",
    text:
`柔らかいソファーやクッション、ベッドなどの上では体が歪み、正しい採寸ができません。だからといって、フローリングで脚が滑りやすい状態も問題です。フローリングの上に滑り止めとして、薄手のブランケットやバスタオルなどを敷いて採寸してください。`
  },

  {
    title:"❸ 測る際の愛犬の体調",
    text:
`寝起きではないですか？寝ていた直後は体が縮こまっている可能性があります。また、すぐに伏せをしてしまったり、怖がっていたりしていませんか？ついつい暴れないように高い所で測ろうとしてしまいたくなりますが、体も強張り、正確な数字とは言えません。寒くて震えていませんか？これもまた体も強張り、正確な数字とは言えません。疲れていませんか？怪我や、普段しないような行動をする可能性もあります。コンディションが悪いと採寸を嫌がりますので、避けましょう。`
  },

  {
    title:"❹ 測る際の体勢",
    text:
`採寸時の犬の体勢をしっかり確認しましょう。4本の脚で立ち、まっすぐ前を見ている状態にします。何かを覗き込むように首を伸ばしたり、へっぴり腰になったり、お座りしたり、伏せたりしていない状態を作りましょう。伏せた状態やお座りした状態では、それぞれ数字が変わり、正しい採寸ができません。リラックスした自然な体勢がベストです。`
  },

  {
    title:"❺ 独自の体型を理解する",
    text:
`お尻にかけてカーブが強い、胸板が厚い、前脚の間隔がとても広いなど、特徴的な体型の場合は、その特徴を意識して採寸しましょう。`
  },

  {
    title:"❻ 呼吸を感じる",
    text:
`呼吸と共に1.0cmから1.5cmほど、採寸時のサイズに変化が出ます。興奮状態ですと特に呼吸が大きくなるため、採寸に誤差が生じます。できる限り落ち着いた状態で採寸することがベストですが、大抵の犬はメジャーを少し怖がり、呼吸が大きくなります。ですので、呼吸を感じながら数字を読み取りましょう。`
  }

];


/* =========================================================
   状態
========================================================= */

let step = 0;

let agreed = false;

let dogInfo = {
  owner:"",
  name:"",
  sex:"",
  birth:"",
  weight:"",
  photo:""
};


/*
  各測定箇所につき3回
*/

let values = items.map(item =>
  item.locations.map(() => ["","",""])
);


/* =========================================================
   画面位置
========================================================= */

function scrollTop(){

  window.scrollTo(0,0);

  document.documentElement.scrollTop = 0;
  document.documentElement.scrollLeft = 0;

  document.body.scrollTop = 0;
  document.body.scrollLeft = 0;

  const main =
    document.getElementById("main");

  if(main){

    main.scrollTop = 0;
    main.scrollLeft = 0;

  }

}


/*
  iPhone Safariでページ移動時に
  表示倍率を通常状態へ戻すことを試みる
*/

function resetViewport(){

  scrollTop();

  const viewport =
    document.querySelector('meta[name="viewport"]');

  if(!viewport) return;

  viewport.setAttribute(
    "content",
    "width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
  );

  setTimeout(() => {

    viewport.setAttribute(
      "content",
      "width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes"
    );

    scrollTop();

  },80);

}


/* =========================================================
   全体描画
========================================================= */

function render(){

  const main =
    document.getElementById("main");

  const pageNumber =
    document.getElementById("pageNumber");

  const progressBar =
    document.getElementById("progressBar");

  const back =
    document.getElementById("backButton");

  const next =
    document.getElementById("nextButton");


  if(step === 0){

    renderPoints();

    pageNumber.textContent = "";

    progressBar.style.width = "0%";

    back.disabled = true;

    next.textContent = "同意して進む →";

    resetViewport();

    return;
  }


  if(step === 1){

    renderInfo();

    pageNumber.textContent = "基本情報";

    progressBar.style.width = "0%";

    back.disabled = false;

    next.textContent = "採寸を始める →";

    resetViewport();

    return;
  }


  if(step >= 2 && step <= 16){

    renderMeasure();

    const number =
      step - 1;

    pageNumber.textContent =
      `${number} / ${items.length}`;

    progressBar.style.width =
      `${(number / items.length) * 100}%`;

    back.disabled = false;

    next.textContent =
      step === 16
        ? "採寸完了 →"
        : "次の採寸へ →";

    resetViewport();

    return;
  }


  if(step === 17){

    renderThanks();

    pageNumber.textContent = "";

    progressBar.style.width = "100%";

    back.disabled = false;

    next.textContent = "採寸結果を見る →";

    resetViewport();

    return;
  }


  if(step === 18){

    renderFinish();

    pageNumber.textContent = "RESULT";

    progressBar.style.width = "100%";

    back.disabled = false;

    next.textContent = "最初に戻る";

    resetViewport();

    return;
  }

}


/* =========================================================
   6つのポイント画面
========================================================= */

function renderPoints(){

  const main =
    document.getElementById("main");

  main.innerHTML = `

    <h1>
      採寸前に<br>
      大切な6つのポイント
    </h1>

    <p class="lead">
      正確な採寸のために、必ずご確認ください。
    </p>

    ${points.map(point => `

      <div class="point-card">

        <div class="point-title">
          ${point.title}
        </div>

        <div class="point-text">
          ${point.text}
        </div>

      </div>

    `).join("")}


    <div class="agree-box">

      <input
        type="checkbox"
        id="agreeCheck"
        ${agreed ? "checked" : ""}
      >

      <label for="agreeCheck">
        6つのポイントを確認しました
      </label>

    </div>

  `;


  document
    .getElementById("agreeCheck")
    .addEventListener("change", e => {

      agreed =
        e.target.checked;

      document
        .getElementById("nextButton")
        .disabled = !agreed;

    });


  document
    .getElementById("nextButton")
    .disabled = !agreed;

}


/* =========================================================
   基本情報
========================================================= */

function renderInfo(){

  const main =
    document.getElementById("main");

  main.innerHTML = `

    <h1>
      わんちゃんの基本情報
    </h1>

    <p class="lead">
      採寸するわんちゃんの情報を入力してください。
    </p>


    <div class="card">


      <div class="field">

        <label>
          飼い主様のお名前
        </label>

        <input
          id="owner"
          type="text"
          placeholder="お名前"
          value="${escapeHtml(dogInfo.owner)}"
        >

      </div>


      <div class="field">

        <label>
          わんちゃんのお名前
        </label>

        <input
          id="dogName"
          type="text"
          placeholder="わんちゃんのお名前"
          value="${escapeHtml(dogInfo.name)}"
        >

      </div>


      <div class="field">

        <label>
          性別
        </label>

        <select id="sex">

          <option value="">
            選択してください
          </option>

          <option

            ${dogInfo.sex === "男の子" ? "selected" : ""}>
            男の子
          </option>

          <option
            value="女の子"
            ${dogInfo.sex === "女の子" ? "selected" : ""}>
            女の子
          </option>

        </select>

      </div>


      <div class="field">

        <label>
          生年月日
        </label>

        <input
          id="birth"
          type="date"
          value="${dogInfo.birth}"
        >

      </div>


      <div class="field">

        <label>
          体重
        </label>

        <input
          id="weight"
          type="number"
          inputmode="decimal"
          step="0.01"
          placeholder="例：4.5"
          value="${dogInfo.weight}"
        >

      </div>


      <div class="field">

        <label>
          わんちゃんの写真
        </label>


        <div
          class="photo-box"
          id="photoBox">

          ${
            dogInfo.photo

            ?

            `
            <img
              src="${dogInfo.photo}"
              alt="わんちゃんの写真">
            `

            :

            `
            <div class="photo-placeholder">
              写真を登録できます
            </div>
            `
          }

        </div>


        <input
          id="photoInput"
          type="file"
          accept="image/*"
          style="display:none"
        >


        <button
          type="button"
          class="small-button"
          id="photoButton">

          写真を変更

        </button>

      </div>


      <div class="card">

        <h2>
          採寸時の注意点
        </h2>

        <div class="point-text">

          わんちゃんがリラックスした状態で測定してください。<br><br>

          メジャーは体に沿わせ、きつすぎず、ゆるすぎないように測ってください。<br><br>

          毛の長さによって数値が変わるため、できるだけ毛をおさえた状態で測定してください。<br><br>

          分からない場合は、無理に測らず、空欄のままで構いません。

        </div>

      </div>

    </div>

  `;


  document
    .getElementById("photoButton")
    .addEventListener("click", () => {

      document
        .getElementById("photoInput")
        .click();

    });


  document
    .getElementById("photoInput")
    .addEventListener("change", e => {

      const file =
        e.target.files[0];

      if(!file) return;

      const reader =
        new FileReader();

      reader.onload =
        event => {

          dogInfo.photo =
            event.target.result;

          renderInfo();

        };

      reader.readAsDataURL(file);

    });

}


/* =========================================================
   HTMLエスケープ
========================================================= */

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   採寸画面
========================================================= */

function renderMeasure(){

  const main =
    document.getElementById("main");

  const index =
    step - 2;

  const item =
    items[index];


  main.innerHTML = `

    <div class="measure-header">

      <div class="measure-number">
        MEASUREMENT ${index + 1}
      </div>

      <div class="measure-title">
        ${item.title}
      </div>

      <div class="measure-description">
        ${item.description}
      </div>

    </div>


    ${item.locations.map(
      (location, locationIndex) => {

        const vals =
          values[index][locationIndex];

        return `

          <div class="location-card">

            <div class="location-title">
              ${location}
            </div>


            <div class="measure-row">


              ${vals.map(
                (value, valueIndex) => `

                  <div class="measure-input">

                    <div class="measure-number-label">
                      ${valueIndex + 1}回目
                    </div>

                    <input
                      type="number"
                      inputmode="decimal"
                      step="0.1"
                      placeholder="0.0"
                      value="${value}"
                      data-location="${locationIndex}"
                      data-index="${valueIndex}"
                    >

                    <div class="measure-unit">
                      cm
                    </div>

                  </div>

                `
              ).join("")}


            </div>


            <div
              class="average"
              id="average-${locationIndex}">
            </div>

          </div>

        `;

      }
    ).join("")}

  `;


  const inputs =
    main.querySelectorAll(
      "input[data-location]"
    );


  inputs.forEach(input => {

    input.addEventListener(
      "input",
      e => {

        const location =
          Number(
            e.target.dataset.location
          );

        const valueIndex =
          Number(
            e.target.dataset.index
          );

        values[index][location][valueIndex] =
          e.target.value;

        updateAverage(
          index,
          location
        );

      }
    );

  });


  item.locations.forEach(
    (_, locationIndex) => {

      updateAverage(
        index,
        locationIndex
      );

    }
  );

}


/* =========================================================
   平均値
========================================================= */

function updateAverage(
  itemIndex,
  locationIndex
){

  const vals =
    values[itemIndex][locationIndex];


  const numbers =
    vals
      .map(v => parseFloat(v))
      .filter(
        v =>
          Number.isFinite(v) &&
          v > 0
      );


  const target =
    document.getElementById(
      `average-${locationIndex}`
    );


  if(!target) return;


  if(numbers.length === 0){

    target.textContent =
      "3回測定してください。";

    return;

  }


  const average =
    numbers.reduce(
      (a,b) => a + b,
      0
    ) / numbers.length;


  if(numbers.length >= 3){

    target.textContent =
      `3回の平均値：${average.toFixed(1)} cm`;

  }else{

    target.textContent =
      `${numbers.length}回入力済み（最低3回がおすすめ）`;

  }

}

    <div class="note">

/* =========================================================
   次へ
========================================================= */

document
  .getElementById("nextButton")
  .addEventListener(
    "click",
    () => {


      /* 6つのポイント */

      if(step === 0){

        if(!agreed) return;

        step = 1;

        render();

        return;

      }


      /* 基本情報 */

      if(step === 1){

        dogInfo.owner =
          document.getElementById("owner").value;

        dogInfo.name =
          document.getElementById("dogName").value;

        dogInfo.sex =
          document.getElementById("sex").value;

        dogInfo.birth =
          document.getElementById("birth").value;

        dogInfo.weight =
          document.getElementById("weight").value;

        step = 2;

        render();

        return;

      }


      /* 15項目 */

      if(step >= 2 && step <= 16){

        step++;

        render();

        return;

      }


      /* お礼 */

      if(step === 17){

        step = 18;

        render();

        return;

      }


      /* 最初へ */

      if(step === 18){

        step = 0;

        render();

        return;

      }

    }
  );


/* =========================================================
   戻る
========================================================= */

document
  .getElementById("backButton")
  .addEventListener(
    "click",
    () => {


      if(step === 0){

        return;

      }


      /* 基本情報 → 6つのポイント */

      if(step === 1){

        dogInfo.owner =
          document.getElementById("owner").value;

        dogInfo.name =
          document.getElementById("dogName").value;

        dogInfo.sex =
          document.getElementById("sex").value;

        dogInfo.birth =
          document.getElementById("birth").value;

        dogInfo.weight =
          document.getElementById("weight").value;

        step = 0;

        render();

        return;

      }


      /* お礼 → 最後の採寸 */

      if(step === 17){

        step = 16;

        render();

        return;

      }


      /* 結果 → お礼 */

      if(step === 18){

        step = 17;

        render();

        return;

      }


      /* 採寸中 */

      if(step >= 2){

        step--;

        render();

        return;

      }

    }
  );


/* =========================================================
   初期表示
========================================================= */

render();

</script>
