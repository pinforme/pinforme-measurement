<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PINFORME 採寸ナビ</title>

<style>
:root{
  --pink:#d96f83;
  --pink2:#e88798;
  --light:#fff7f8;
  --line:#ead9dd;
  --text:#333;
  --muted:#777;
  --bg:#f7f2ef;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

#app{
  width:100%;
  max-width:520px;
  margin:0 auto;
  min-height:100vh;
  background:#fff;
}

/* =========================
   ヘッダー
========================= */

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(8px);
  padding:14px 20px 12px;
  border-bottom:1px solid #eee;
}

.brand{
  font-size:22px;
  font-weight:800;
  letter-spacing:.08em;
}

.brand small{
  display:block;
  font-size:10px;
  letter-spacing:.18em;
  color:#999;
  margin-top:2px;
}

.progress{
  height:5px;
  background:#eee;
  border-radius:99px;
  overflow:hidden;
  margin-top:10px;
}

.progress i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--pink),var(--pink2));
  border-radius:99px;
  transition:.3s;
}

/* =========================
   基本
========================= */

main{
  padding:22px 18px 105px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

h1{
  font-size:24px;
  margin:4px 0 8px;
  line-height:1.35;
}

h2{
  font-size:20px;
  margin:0 0 12px;
}

.lead{
  color:#666;
  font-size:13px;
  line-height:1.8;
  margin:0 0 18px;
}

.paw{
  color:var(--pink);
  margin-right:7px;
}

.card{
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  background:#fff;
  margin-bottom:14px;
}

.label{
  font-weight:700;
  font-size:14px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  gap:8px;
}

.req{
  font-size:10px;
  color:#fff;
  background:var(--pink);
  padding:3px 6px;
  border-radius:99px;
  font-weight:700;
}

input[type=text],
input[type=number],
input[type=date],
select{
  width:100%;
  height:50px;
  border:1px solid #d8d8d8;
  border-radius:10px;
  background:#fff;
  padding:0 14px;
  color:#333;
  outline:none;
}

input:focus,
select:focus{
  border-color:var(--pink);
  box-shadow:0 0 0 3px rgba(217,111,131,.12);
}

/* =========================
   名前＋くんちゃん
========================= */

.name-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:end;
}

.suffix{
  display:flex;
  border:1px solid #ddd;
  border-radius:10px;
  overflow:hidden;
  height:50px;
  background:#fff;
}

.suffix label{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 13px;
  min-width:64px;
  font-size:13px;
}

.suffix input{
  position:absolute;
  opacity:0;
}

.suffix label:has(input:checked){
  background:#fff0f3;
  color:var(--pink);
  font-weight:700;
}

/* =========================
   6ポイント
========================= */

.point-title{
  font-weight:800;
  font-size:16px;
  margin-bottom:10px;
}

.point{
  border:1px solid #eadde0;
  border-radius:12px;
  padding:12px;
  margin-bottom:9px;
  background:#fffafa;
}

.point b{
  color:var(--pink);
  margin-right:6px;
}

.point p{
  font-size:12px;
  line-height:1.7;
  margin:5px 0 0;
  color:#555;
}

.agree{
  display:flex;
  align-items:center;
  gap:10px;
  padding:15px;
  border:2px solid #ddd;
  border-radius:12px;
  margin-top:16px;
  font-weight:700;
}

.agree:has(input:checked){
  border-color:var(--pink);
  background:#fff7f8;
}

.agree input{
  width:22px;
  height:22px;
  accent-color:var(--pink);
  flex:none;
}

/* =========================
   情報確認
========================= */

.info-summary{
  background:#fffafa;
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px;
  margin-bottom:16px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:9px 0;
  border-bottom:1px solid #eee;
  font-size:13px;
}

.summary-row:last-child{
  border-bottom:0;
}

.summary-row span:first-child{
  color:#777;
}

.summary-row strong{
  text-align:right;
}

/* =========================
   性別
========================= */

.sex{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.sex label{
  position:relative;
}

.sex input{
  position:absolute;
  opacity:0;
}

.sex span{
  display:block;
  text-align:center;
  border:1px solid #ddd;
  border-radius:10px;
  padding:14px 8px;
}

.sex label:has(input:checked) span{
  border-color:var(--pink);
  background:#fff0f3;
  color:var(--pink);
  font-weight:700;
}

/* =========================
   写真
========================= */

.photo-box{
  border:1px dashed #d7c6ca;
  border-radius:12px;
  padding:12px;
  text-align:center;
}

.photo-preview{
  width:100%;
  aspect-ratio:1/1;
  border-radius:10px;
  background:#f4eeee;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  margin-bottom:10px;
}

.photo-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.photo-btn{
  display:inline-flex;
  border:1px solid #ddd;
  background:#fff;
  border-radius:9px;
  padding:10px 16px;
  color:#555;
}

/* =========================
   採寸画面
========================= */

.measure-head{
  display:flex;
  align-items:flex-start;
  gap:10px;
}

.num{
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--pink);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  flex:none;
}

.measure-desc{
  font-size:13px;
  line-height:1.8;
  color:#555;
  white-space:pre-line;
  margin:8px 0 14px;
}

/* 採寸イメージ */

.illustration{
  height:210px;
  border-radius:12px;
  background:linear-gradient(180deg,#fff,#faf5f5);
  border:1px solid #f0e2e5;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:15px;
  overflow:hidden;
}

.dog-svg{
  width:88%;
  height:88%;
}

/* 測定位置 */

.location{
  font-size:12px;
  color:#777;
  background:#fafafa;
  border-radius:8px;
  padding:8px 10px;
  margin-bottom:10px;
}

.location b{
  color:#555;
}

/* 入力 */

.measure-group{
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
}

.measure-group-title{
  font-size:13px;
  font-weight:700;
  margin-bottom:8px;
}

.measure-input{
  display:grid;
  grid-template-columns:52px 1fr 30px;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
}

.measure-input:last-child{
  margin-bottom:0;
}

.measure-input label{
  font-size:12px;
  color:#666;
}

.measure-input input{
  height:44px;
}

.cm{
  font-size:12px;
  color:#666;
}

.note{
  font-size:11px;
  color:#777;
  line-height:1.6;
  margin:12px 2px;
}

.avg{
  margin-top:12px;
  background:#fff5f7;
  border-radius:10px;
  padding:11px;
  text-align:center;
  font-weight:700;
  color:#9e4e60;
}

/* =========================
   ナビゲーション
========================= */

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:30;
  background:rgba(255,255,255,.96);
  border-top:1px solid #eee;
  padding:
    10px
    max(18px,calc((100vw - 520px)/2 + 18px))
    calc(10px + env(safe-area-inset-bottom));
  display:flex;
  gap:10px;
}

.nav button{
  height:50px;
  border-radius:11px;
  border:1px solid #ddd;
  background:#fff;
  font-weight:700;
  flex:1;
}

.nav .next{
  background:var(--pink);
  color:#fff;
  border-color:var(--pink);
}

.nav .next:disabled{
  background:#d8d8d8;
  border-color:#d8d8d8;
  color:#fff;
  cursor:not-allowed;
}

/* =========================
   完了画面
========================= */

.thanks{
  text-align:center;
  padding:28px 8px;
}

.thanks .heart{
  font-size:40px;
  color:var(--pink);
}

.thanks h1{
  margin-top:8px;
}

.thanks p{
  font-size:14px;
  line-height:2;
  color:#555;
}

/* =========================
   結果画面
========================= */

.result-photo{
  width:100%;
  max-width:300px;
  aspect-ratio:1/1;
  border-radius:14px;
  object-fit:cover;
  display:block;
  margin:0 auto 18px;
  background:#f4eeee;
}

.result-table{
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
}

.result-table .r{
  display:flex;
  justify-content:space-between;
  padding:11px 13px;
  border-bottom:1px solid #eee;
  font-size:13px;
}

.result-table .r:last-child{
  border-bottom:0;
}

.result-table .r span:first-child{
  color:#777;
}

.result-title{
  font-size:21px;
  font-weight:800;
  text-align:center;
  margin:5px 0 18px;
}

.measure-list{
  margin-top:16px;
}

.measure-result-card{
  border:1px solid #eee;
  border-radius:10px;
  padding:11px;
  margin-bottom:8px;
}

.measure-result-card strong{
  display:block;
  margin-bottom:5px;
}

.measure-result-card div{
  font-size:12px;
  color:#666;
  line-height:1.6;
}

.hidden{
  display:none!important;
}

.small{
  font-size:11px;
  color:#999;
}

/* =========================
   スマホ
========================= */

@media(max-width:380px){

  main{
    padding-left:14px;
    padding-right:14px;
  }

  .name-row{
    grid-template-columns:1fr;
  }

  .suffix{
    width:100%;
  }

  .suffix label{
    flex:1;
  }
}
</style>
</head>

<body>

<div id="app">

<header>
  <div class="brand">
    PINFORME
    <small>MEASUREMENT NAVI</small>
  </div>

  <div class="progress">
    <i id="progress"></i>
  </div>
</header>

<main>

  <!-- 最初の画面 -->
  <section class="screen active" id="screen0"></section>

  <!-- 基本情報 -->
  <section class="screen" id="screen1"></section>

  <!-- 採寸 -->
  <section class="screen" id="measureScreen"></section>

  <!-- 完了 -->
  <section class="screen" id="thanksScreen"></section>

  <!-- 結果 -->
  <section class="screen" id="resultScreen"></section>

</main>

</div>

<!-- 下部ナビ -->
<div class="nav">
  <button id="backBtn" onclick="back()">戻る</button>
  <button id="nextBtn" class="next" onclick="next()">次へ</button>
</div>


<script>

/* ========================================
   採寸前に 大切な6つのポイント
======================================== */

const points = [

[
"❶",
"採寸は最低3回は測る事",
"犬は動きますので、一度の採寸では確かな数字ではありません。できるだけ同じ場所を最低3回測り、安定した数値を確認しましょう。"
],

[
"❷",
"測る際の立たせている場所",
"柔らかいソファーやクッション、ベッドなどの上では体が歪み、正しい採寸ができません。だからといって、フローリングで脚が滑りやすい状態も問題です。フローリングの上に滑り止めとして、薄手のブランケットやバスタオルなどを敷いて採寸してください。"
],

[
"❸",
"測る際の愛犬の体調",
"寝起きではないですか？寝ていた直後は体が縮こまっている可能性があります。また、すぐに伏せをしてしまったり、怖がっていたりしていませんか？ついつい暴れないように高い所で測ろうとしてしまいたくなりますが、体も強張り、正確な数字とは言えません。寒くて震えていませんか？これもまた体も強張り、正確な数字とは言えません。疲れていませんか？怪我や、普段しないような行動をする可能性もあります。コンディションが悪いと採寸を嫌がりますので、避けましょう。"
],

[
"❹",
"測る際の体勢",
"採寸時の犬の体勢をしっかり確認しましょう。4本の脚で立ち、まっすぐ前を見ている状態にします。何かを覗き込むように首を伸ばしたり、へっぴり腰になったり、お座りしたり、伏せたりしていない状態を作りましょう。伏せた状態やお座りした状態では、それぞれ数字が変わり、正しい採寸ができません。リラックスした自然な体勢がベストです。"
],

[
"❺",
"独自の体型を理解する",
"お尻にかけてカーブが強い、胸板が厚い、前脚の間隔がとても広いなど、特徴的な体型の場合は、その特徴を意識して採寸しましょう。"
],

[
"❻",
"呼吸を感じる",
"呼吸と共に1.0cmから1.5cmほど、採寸時のサイズに変化が出ます。興奮状態ですと特に呼吸が大きくなるため、採寸に誤差が生じます。できる限り落ち着いた状態で採寸することがベストですが、大抵の犬はメジャーを少し怖がり、呼吸が大きくなります。ですので、呼吸を感じながら数字を読み取りましょう。"
]

];


/* ========================================
   15項目
======================================== */

const items = [

{
n:"❶",
title:"首まわり（首の付け根）",
desc:"姿勢を正した時にちょうど首から胴体に変わる瞬間部分\nの毛並みが変わる所があります。",
locations:["首の付け根"]
},

{
n:"❷",
title:"胴まわり",
desc:"一番胸が張っているポイントで測ります。\n大体前脚の脇あたりから2cmから3cm後ろへ行った辺りに\nなります。",
locations:["胴まわり"]
},

{
n:"❸",
title:"ウェスト",
desc:"胴体で一番細い部分を一周測ります。",
locations:["ウェスト"]
},

{
n:"❹",
title:"着丈",
desc:"首まわりを測った位置から尻尾の付け根までを測ります。尻尾は軽く持ち上げますと、首まわり同様に毛並みが\n変わるラインが薄っすら見えますのでそのラインまでを\n測ります。",
locations:["首の付け根 → 尻尾の付け根"]
},

{
n:"❺",
title:"前身頃",
desc:"首まわりを測った位置からお腹部分を多いかぶせて\nあげたい部分までを測ります。",
locations:["首の付け根 → お腹部分"]
},

{
n:"❻",
title:"前脚の太さ",
desc:"太いところと細いところを測ります。\n服を作る時の目安になります。",
locations:["太いところ","細いところ"]
},

{
n:"❼",
title:"後脚の太さ",
desc:"太いところと細いところを測ります。\n服を作る時の目安になります。",
locations:["太いところ","細いところ"]
},

{
n:"❽",
title:"前脚の長さ",
desc:"脇から関節ごとに地面までを測ります。\n服を作る時の目安になります。",
locations:["脇 → 肘","肘 → 手首","手首 → 地面"]
},

{
n:"❾",
title:"後脚の長さ",
desc:"測るポイントは❼の測ったラインからになります。\n内側でズボンが止まるポイントとなりますのでそこから\nスタートします。関節ごとに地面までを測ります。\n服を作る時の目安になります。",
locations:["❼で測ったライン → 膝","膝 → 足首","足首 → 地面"]
},

{
n:"❿",
title:"首の長さ(ネック)",
desc:"首まわりを測った位置から後頭部に入る手前までの長さ\nでネックデザインを決める際に参考にないます。",
locations:["首の付け根 → 後頭部手前"]
},

{
n:"⓫",
title:"首の長さ(スヌーズ)",
desc:"首まわりを測った位置から額までの長さでスヌードを測る\n際に参考になります。",
locations:["首の付け根 → 額"]
},

{
n:"⓬",
title:"頭周り",
desc:"額から一周測ります。\n首まわりより頭まわりの方が大きい場合があります。\nお洋服を着せる際は頭から着せますので、密かに重要\nポイントとなります。",
locations:["頭周り"]
},

{
n:"⓭",
title:"前脚の幅",
desc:"犬を前から見たときの前脚の脚と脚の間の幅です。\n体格の差や骨格の差や犬種にもより異なります。",
locations:["前脚と前脚の間"]
},

{
n:"⓮",
title:"首の真ん中",
desc:"首の中でも一番細い部分を測ります",
locations:["首の一番細い部分"]
},

{
n:"⓯",
title:"尻尾の太さ",
desc:"付け根の一番太い部分を測ります",
locations:["尻尾の付け根"]
}

];


/* ========================================
   わんちゃん情報
======================================== */

let dogInfo = {

  owner:"",
  name:"",
  suffix:"くん",
  breed:"",
  sex:"",
  birth:"",
  weight:"",
  photo:""

};

let agreed = false;

let current = 0;


/* ========================================
   採寸データ
======================================== */

let values = items.map(item =>
  item.locations.map(() => ["","",""])
);


/* ========================================
   HTML特殊文字対策
======================================== */

function esc(s){

  return String(s ?? "").replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );

}


/* ========================================
   名前表示
======================================== */

function dogDisplay(){

  return `${esc(dogInfo.name)} ${dogInfo.suffix}`;

}


/* ========================================
   最初の画面
======================================== */

function renderStart(){

  document.getElementById("screen0").innerHTML = `

    <h1>
      <span class="paw">🐾</span>
      はじめに
    </h1>

    <p class="lead">
      採寸を始める前に、必要な情報を入力してください。
    </p>


    <!-- ご主人様の名前 -->

    <div class="card">

      <div class="label">
        ご主人様の名前
        <span class="req">必須</span>
      </div>

      <input
        id="ownerInput"
        type="text"
        placeholder="例）山田 太郎"
        value="${esc(dogInfo.owner)}"
      >

    </div>


    <!-- わんちゃんの名前 -->

    <div class="card">

      <div class="label">
        わんちゃんの名前
        <span class="req">必須</span>
      </div>

      <div class="name-row">

        <input
          id="nameInput"
          type="text"
          placeholder="例）マロン"
          value="${esc(dogInfo.name)}"
        >

        <div class="suffix">

          <label>
            <input
              type="radio"
              name="suffix"
              value="くん"
              ${dogInfo.suffix === "くん" ? "checked" : ""}
            >
            <span>くん</span>
          </label>

          <label>
            <input
              type="radio"
              name="suffix"
              value="ちゃん"
              ${dogInfo.suffix === "ちゃん" ? "checked" : ""}
            >
            <span>ちゃん</span>
          </label>

        </div>

      </div>

    </div>


    <!-- 犬種 -->

    <div class="card">

      <div class="label">
        犬種
        <span class="req">必須</span>
      </div>

      <input
        id="breedInput"
        type="text"
        placeholder="例）ミニチュア・ピンシャー"
        value="${esc(dogInfo.breed)}"
      >

    </div>


    <!-- 6つのポイント -->

/* ========================================

function handlePhoto(e){

  const file = e.target.files?.[0];

  if(!file){
    return;
  }

  const reader = new FileReader();

  reader.onload = ev => {

    dogInfo.photo = ev.target.result;

    document.getElementById("photoPreview").innerHTML = `

      <img
        src="${dogInfo.photo}"
        alt="わんちゃんの写真"
      >

    `;

  };

  reader.readAsDataURL(file);

}

/* ========================================
   平均値
======================================== */

function updateAverage(idx,j){

  const nums =
    values[idx][j]
      .map(Number)
      .filter(
        n => Number.isFinite(n) && n > 0
      );


  const avg =
    nums.length
    ?
    Math.round(
      nums.reduce((a,b) => a+b,0)
      /
      nums.length
      *
      10
    ) / 10
    :
    null;


  const el =
    document.getElementById(`avg-${j}`);


  if(!el){
    return;
  }


  if(avg === null){

    el.textContent = "平均：— cm";

  }else{

    el.textContent =
      `平均：${avg.toFixed(1)} cm`;

  }

}

/* ========================================
   画面切り替え
======================================== */

function showScreen(){

  document
    .querySelectorAll(".screen")
    .forEach(
      s => s.classList.remove("active")
    );


  if(current === 0){

    document
      .getElementById("screen0")
      .classList.add("active");

    renderStart();

  }

  else if(current === 1){

    document
      .getElementById("screen1")
      .classList.add("active");

    renderInfo();

  }

  else if(current >= 2 && current <= 16){

    document
      .getElementById("measureScreen")
      .classList.add("active");

    renderMeasure();

  }

  else if(current === 17){

    document
      .getElementById("thanksScreen")
      .classList.add("active");

    renderThanks();

  }

  else{

    document
      .getElementById("resultScreen")
      .classList.add("active");

    renderResult();

  }


  updateProgress();

  updateButtons();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ========================================
   プログレスバー
======================================== */

function updateProgress(){

  const total = 19;

  const pct =
    Math.min(
      100,
      Math.max(
        0,
        current / (total - 1) * 100
      )
    );


  document
    .getElementById("progress")
    .style.width = pct + "%";

}


/* ========================================
   ボタン
======================================== */

function updateButtons(){

  const back =
    document.getElementById("backBtn");

  const nextBtn =
    document.getElementById("nextBtn");


  /* 結果画面 */

  if(current === 18){

    back.style.display = "none";

    nextBtn.style.display = "none";

    return;

  }


  /* 最初の画面 */

  if(current === 0){

    back.style.display = "none";

  }else{

    back.style.display = "block";

  }


  nextBtn.style.display = "block";


  if(current === 17){

    nextBtn.textContent = "結果を見る";

  }else{

    nextBtn.textContent = "次へ";

  }


  /* 最初の画面だけ必須チェック */

  if(current === 0){

    nextBtn.disabled =
      !(
        dogInfo.owner.trim()
        &&
        dogInfo.name.trim()
        &&
        dogInfo.breed.trim()
        &&
        agreed
      );

  }else{

    nextBtn.disabled = false;

  }

}


/* ========================================
   次へ
======================================== */

function next(){

  if(
    current === 0 &&
    !(
      dogInfo.owner.trim()
      &&
      dogInfo.name.trim()
      &&
      dogInfo.breed.trim()
      &&
      agreed
    )
  ){

    return;

  }


  if(current < 18){

    current++;

    showScreen();

  }

}


/* ========================================
   戻る
======================================== */

function back(){

  if(current > 0){

    current--;

    showScreen();

  }

}


/* ========================================
   開始
======================================== */

showScreen();

</script>
