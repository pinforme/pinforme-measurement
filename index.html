<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
<title>PINFORME 採寸ナビ</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  overflow-x:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  color:#222;
  background:#fff;
}

body{
  min-height:100vh;
}

button,
input{
  font-family:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.header{
  position:sticky;
  top:0;
  z-index:100;
  background:#fff;
  border-bottom:1px solid #eee;
}

.header-inner{
  width:100%;
  max-width:520px;
  margin:0 auto;
  padding:14px 20px 10px;
}

.logo{
  text-align:center;
  font-size:20px;
  font-weight:700;
  letter-spacing:2px;
}

.progress-wrap{
  margin-top:10px;
  width:100%;
  height:4px;
  background:#eee;
  border-radius:10px;
  overflow:hidden;
}

.progress{
  height:100%;
  width:0%;
  background:#222;
  transition:width .25s ease;
}

main{
  width:100%;
  max-width:520px;
  margin:0 auto;
  padding:24px 20px 110px;
  overflow-x:hidden;
}

h1{
  font-size:24px;
  line-height:1.4;
  margin:0 0 12px;
  text-align:center;
}

h2{
  font-size:21px;
  line-height:1.5;
  margin:0 0 12px;
}

.subtitle{
  text-align:center;
  color:#777;
  font-size:14px;
  line-height:1.7;
  margin-bottom:24px;
}

.point-card{
  border:1px solid #e5e5e5;
  border-radius:16px;
  padding:18px 16px;
  margin-bottom:14px;
  background:#fff;
}

.point-title{
  font-size:17px;
  font-weight:700;
  margin-bottom:10px;
}

.point-text{
  font-size:14px;
  line-height:1.8;
  white-space:pre-line;
}

.agreement-card{
  margin-top:22px;
  padding:17px;
  border:2px solid #222;
  border-radius:16px;
  background:#fafafa;
}

.required-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
}

.required-badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:6px;
  background:#222;
  color:#fff;
  font-size:11px;
  font-weight:700;
}

.required-text{
  font-size:13px;
  font-weight:700;
}

.agreement-label{
  display:flex;
  align-items:flex-start;
  gap:12px;
  cursor:pointer;
  font-size:16px;
  font-weight:700;
  line-height:1.6;
}

.agreement-label input{
  flex:none;
  width:23px;
  height:23px;
  margin:1px 0 0;
  accent-color:#222;
}

.agreement-note{
  margin:10px 0 0 35px;
  color:#777;
  font-size:12px;
  line-height:1.6;
}

.breed-box{
  margin-bottom:24px;
  padding:17px;
  border:2px solid #222;
  border-radius:16px;
  background:#fff;
}

.breed-title{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
  font-size:16px;
  font-weight:700;
}

.input-label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin-bottom:8px;
}

input[type="text"],
input[type="number"],
input[type="date"]{
  -webkit-appearance:none;
  appearance:none;
  display:block;
  width:100%;
  max-width:100%;
  min-width:0;
  height:50px;
  padding:12px 14px;
  border:1px solid #d8d8d8;
  border-radius:10px;
  background:#fff;
  color:#222;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#222;
}

.input-help{
  color:#777;
  font-size:12px;
  margin-top:7px;
}

.info-card{
  border:1px solid #e5e5e5;
  border-radius:16px;
  padding:18px 16px;
  margin-bottom:14px;
}

.field{
  margin-bottom:18px;
}

.field:last-child{
  margin-bottom:0;
}

.sex-buttons{
  display:flex;
  gap:10px;
}

.sex-button{
  flex:1;
  height:48px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  font-size:15px;
}

.sex-button.active{
  background:#222;
  color:#fff;
  border-color:#222;
}

.photo-card{
  border:1px solid #e5e5e5;
  border-radius:16px;
  padding:16px;
  margin-bottom:18px;
}

.photo-preview{
  width:100%;
  aspect-ratio:1/1;
  border-radius:12px;
  background:#f5f5f5;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#999;
  font-size:13px;
  margin-bottom:12px;
}

.photo-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.photo-button{
  width:100%;
  height:46px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  font-size:14px;
}

.measure-header{
  margin-bottom:20px;
}

.measure-number{
  display:inline-block;
  font-size:13px;
  font-weight:700;
  color:#777;
  margin-bottom:7px;
}

.measure-title{
  font-size:23px;
  font-weight:700;
  line-height:1.4;
  margin:0 0 12px;
}

.description{
  font-size:14px;
  line-height:1.8;
  white-space:pre-line;
  color:#444;
}

.location-card{
  border:1px solid #e5e5e5;
  border-radius:16px;
  padding:16px;
  margin-bottom:14px;
}

.location-title{
  font-size:16px;
  font-weight:700;
  line-height:1.5;
  margin-bottom:12px;
}

.measure-input-row{
  display:flex;
  gap:8px;
  width:100%;
}

.measure-input{
  flex:1;
  min-width:0;
}

.measure-input input{
  width:100%;
  height:48px;
  padding:10px;
  text-align:center;
  font-size:16px;
}

.measure-label{
  text-align:center;
  font-size:11px;
  color:#666;
  margin-top:5px;
}

.cm-label{
  text-align:center;
  font-size:11px;
  color:#777;
  margin-top:3px;
}

.average-box{
  margin-top:14px;
  padding:12px;
  border-radius:10px;
  background:#f7f7f7;
  text-align:center;
}

.average-label{
  font-size:12px;
  color:#777;
}

.average-value{
  font-size:20px;
  font-weight:700;
  margin-top:3px;
}

.notice{
  margin-top:20px;
  padding:16px;
  border-radius:12px;
  background:#f7f7f7;
  font-size:13px;
  line-height:1.8;
}

.thanks{
  text-align:center;
  padding:50px 10px;
}

.thanks-icon{
  font-size:48px;
  margin-bottom:15px;
}

.thanks-title{
  font-size:24px;
  font-weight:700;
  margin-bottom:12px;
}

.result-card{
  border:1px solid #e5e5e5;
  border-radius:16px;
  padding:18px 16px;
  margin-bottom:14px;
}

.result-photo{
  width:100%;
  aspect-ratio:1/1;
  border-radius:12px;
  background:#f5f5f5;
  overflow:hidden;
  margin-bottom:16px;
}

.result-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.result-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:10px 0;
  border-bottom:1px solid #eee;
  font-size:14px;
}

.result-row:last-child{
  border-bottom:none;
}

.result-name{
  color:#666;
}

.result-value{
  font-weight:700;
  text-align:right;
}

.result-section-title{
  font-size:17px;
  font-weight:700;
  margin:22px 0 10px;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:100;
  background:rgba(255,255,255,.96);
  border-top:1px solid #eee;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}

.bottom-nav-inner{
  max-width:520px;
  margin:0 auto;
  display:flex;
  gap:10px;
}

.nav-button{
  height:52px;
  border-radius:12px;
  border:1px solid #ddd;
  background:#fff;
  font-size:15px;
  font-weight:700;
}

.nav-button.back{
  width:34%;
}

.nav-button.next{
  flex:1;
  background:#222;
  color:#fff;
  border-color:#222;
}

.nav-button.next:disabled{
  background:#d5d5d5;
  border-color:#d5d5d5;
  color:#fff;
}

.hidden{
  display:none!important;
}

@media(max-width:380px){
  main{
    padding-left:16px;
    padding-right:16px;
  }

  .measure-input-row{
    gap:5px;
  }

  .measure-input input{
    padding:8px 5px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <div class="logo">PINFORME</div>
    <div class="progress-wrap">
      <div class="progress" id="progress"></div>
    </div>
  </div>
</header>

<main id="app"></main>

<div class="bottom-nav">
  <div class="bottom-nav-inner">
    <button class="nav-button back" id="backButton" type="button">
      戻る
    </button>

    <button class="nav-button next" id="nextButton" type="button">
      次へ
    </button>
  </div>
</div>

<script>

const items = [

  {
    no:"❶",
    title:"首まわり（首の付け根）",
    description:"姿勢を正した時にちょうど首から胴体に変わる瞬間部分\nの毛並みが変わる所があります。",
    locations:["首の付け根"]
  },

  {
    no:"❷",
    title:"胴まわり",
    description:"一番胸が張っているポイントで測ります。\n大体前脚の脇あたりから2cmから3cm後ろへ行った辺りに\nなります。",
    locations:["胴まわり"]
  },

  {
    no:"❸",
    title:"ウェスト",
    description:"胴体で一番細い部分を一周測ります。",
    locations:["ウェスト"]
  },

  {
    no:"❹",
    title:"着丈",
    description:"首まわりを測った位置から尻尾の付け根までを測ります。尻尾は軽く持ち上げますと、首まわり同様に毛並みが\n変わるラインが薄っすら見えますのでそのラインまでを\n測ります。",
    locations:["首の付け根 → 尻尾の付け根"]
  },

  {
    no:"❺",
    title:"前身頃",
    description:"首まわりを測った位置からお腹部分を多いかぶせて\nあげたい部分までを測ります。",
    locations:["首の付け根 → お腹部分"]
  },

  {
    no:"❻",
    title:"前脚の太さ",
    description:"太いところと細いところを測ります。\n服を作る時の目安になります。",
    locations:["太いところ","細いところ"]
  },

  {
    no:"❼",
    title:"後脚の太さ",
    description:"太いところと細いところを測ります。\n服を作る時の目安になります。",
    locations:["太いところ","細いところ"]
  },

  {
    no:"❽",
    title:"前脚の長さ",
    description:"脇から関節ごとに地面までを測ります。\n服を作る時の目安になります。",
    locations:["脇 → 肘","肘 → 手首","手首 → 地面"]
  },

  {
    no:"❾",
    title:"後脚の長さ",
    description:"測るポイントは❼の測ったラインからになります。\n内側でズボンが止まるポイントとなりますのでそこから\nスタートします。関節ごとに地面までを測ります。\n服を作る時の目安になります。",
    locations:["❼で測ったライン → 膝","膝 → 足首","足首 → 地面"]
  },

  {
    no:"❿",
    title:"首の長さ(ネック)",
    description:"首まわりを測った位置から後頭部に入る手前までの長さ\nでネックデザインを決める際に参考にないます。",
    locations:["首の付け根 → 後頭部手前"]
  },

  {
    no:"⓫",
    title:"首の長さ(スヌーズ)",
    description:"首まわりを測った位置から額までの長さでスヌードを測る\n際に参考になります。",
    locations:["首の付け根 → 額"]
  },

  {
    no:"⓬",
    title:"頭周り",
    description:"額から一周測ります。\n首まわりより頭まわりの方が大きい場合があります。\nお洋服を着せる際は頭から着せますので、密かに重要\nポイントとなります。",
    locations:["頭周り"]
  },

  {
    no:"⓭",
    title:"前脚の幅",
    description:"犬を前から見たときの前脚の脚と脚の間の幅です。\n体格の差や骨格の差や犬種にもより異なります。",
    locations:["前脚と前脚の間"]
  },

  {
    no:"⓮",
    title:"首の真ん中",
    description:"首の中でも一番細い部分を測ります",
    locations:["首の一番細い部分"]
  },

  {
    no:"⓯",
    title:"尻尾の太さ",
    description:"付け根の一番太い部分を測ります",
    locations:["尻尾の付け根"]
  }

];

const points = [

  {
    no:"❶",
    title:"採寸は最低3回は測る事",
    text:"犬は動きますので、一度の採寸では確かな数字ではありません。できるだけ同じ場所を最低3回測り、安定した数値を確認しましょう。"
  },

  {
    no:"❷",
    title:"測る際の立たせている場所",
    text:"柔らかいソファーやクッション、ベッドなどの上では体が歪み、正しい採寸ができません。だからといって、フローリングで脚が滑りやすい状態も問題です。フローリングの上に滑り止めとして、薄手のブランケットやバスタオルなどを敷いて採寸してください。"
  },

  {
    no:"❸",
    title:"測る際の愛犬の体調",
    text:"寝起きではないですか？寝ていた直後は体が縮こまっている可能性があります。また、すぐに伏せをしてしまったり、怖がっていたりしていませんか？ついつい暴れないように高い所で測ろうとしてしまいたくなりますが、体も強張り、正確な数字とは言えません。寒くて震えていませんか？これもまた体も強張り、正確な数字とは言えません。疲れていませんか？怪我や、普段しないような行動をする可能性もあります。コンディションが悪いと採寸を嫌がりますので、避けましょう。"
  },

  {
    no:"❹",
    title:"測る際の体勢",
    text:"採寸時の犬の体勢をしっかり確認しましょう。4本の脚で立ち、まっすぐ前を見ている状態にします。何かを覗き込むように首を伸ばしたり、へっぴり腰になったり、お座りしたり、伏せたりしていない状態を作りましょう。伏せた状態やお座りした状態では、それぞれ数字が変わり、正しい採寸ができません。リラックスした自然な体勢がベストです。"
  },

  {
    no:"❺",
    title:"独自の体型を理解する",
    text:"お尻にかけてカーブが強い、胸板が厚い、前脚の間隔がとても広いなど、特徴的な体型の場合は、その特徴を意識して採寸しましょう。"
  },

  {
    no:"❻",
    title:"呼吸を感じる",
    text:"呼吸と共に1.0cmから1.5cmほど、採寸時のサイズに変化が出ます。興奮状態ですと特に呼吸が大きくなるため、採寸に誤差が生じます。できる限り落ち着いた状態で採寸することがベストですが、大抵の犬はメジャーを少し怖がり、呼吸が大きくなります。ですので、呼吸を感じながら数字を読み取りましょう。"
  }

];

const warningText =
"・わんちゃんがリラックスした状態で測定してください。\n\n" +
"・メジャーは体に沿わせ、きつすぎず、ゆるすぎないように測ってください。\n\n" +
"・毛の長さによって数値が変わるため、できるだけ毛をおさえた状態で測定してください。\n\n" +
"・分からない場合は、無理に測らず、空欄のままで構いません。";


let step = 0;

let agreed = false;

let dogInfo = {
  breed:"",
  owner:"",
  name:"",
  sex:"",
  birth:"",
  weight:"",
  photo:""
};

let values = items.map(item =>
  item.locations.map(() => ["","",""])
);


/* -----------------------------
   画面表示
----------------------------- */

function render(){

  const app = document.getElementById("app");

  if(step === 0){
    renderPoints(app);
  }
  else if(step === 1){
    renderInfo(app);
  }
  else if(step >= 2 && step <= 16){
    renderMeasure(app, step - 2);
  }
  else if(step === 17){
    renderThanks(app);
  }
  else if(step === 18){
    renderResult(app);
  }

  updateNavigation();

  window.scrollTo({
    top:0,
    behavior:"instant"
  });

}


/* -----------------------------
   6つのポイント
----------------------------- */

function renderPoints(app){

  app.innerHTML = `
    <h1>採寸前に<br>大切な6つのポイント</h1>

    <div class="subtitle">
      正確な採寸のために、必ず確認してください。
    </div>

    <div class="breed-box">
      <div class="breed-title">
        犬種
        <span class="required-badge">必須</span>
      </div>

      <input
        id="breedInput"
        type="text"
        placeholder="例：ミニチュア・ピンシャー"
        value="${escapeHtml(dogInfo.breed)}"
      >

      <div class="input-help">
        採寸するわんちゃんの犬種を入力してください。
      </div>
    </div>

    ${points.map(point => `
      <div class="point-card">
        <div class="point-title">
          ${point.no} ${point.title}
        </div>

        <div class="point-text">
          ${point.text}
        </div>
      </div>
    `).join("")}

    <div class="agreement-card">

      <div class="required-row">
        <span class="required-badge">必須</span>
        <span class="required-text">最後まで確認してください</span>
      </div>

      <label class="agreement-label" for="agreeCheck">

        <input
          id="agreeCheck"
          type="checkbox"
          ${agreed ? "checked" : ""}
        >

        <span>
          6つのポイントを確認しました
        </span>

      </label>

      <div class="agreement-note">
        ※犬種の入力と、このチェックの両方が完了すると「次へ」に進めます。
      </div>

    </div>
  `;

  const breedInput = document.getElementById("breedInput");

  breedInput.addEventListener("input", function(){
    dogInfo.breed = this.value;
    updateNavigation();
  });

  const check = document.getElementById("agreeCheck");

  check.addEventListener("change", function(){
    agreed = this.checked;
    updateNavigation();
  });

}


/* -----------------------------
   基本情報
----------------------------- */

function renderInfo(app){

  app.innerHTML = `

    <h1>わんちゃんの情報</h1>

    <div class="subtitle">
      採寸するわんちゃんの情報を入力してください。
    </div>

    <div class="info-card">

      <div class="field">
        <label class="input-label">飼い主様のお名前</label>

        <input
          id="ownerInput"
          type="text"
          placeholder="お名前"
          value="${escapeHtml(dogInfo.owner)}"
        >
      </div>

      <div class="field">
        <label class="input-label">わんちゃんのお名前</label>

        <input
          id="nameInput"
          type="text"
          placeholder="わんちゃんのお名前"
          value="${escapeHtml(dogInfo.name)}"
        >
      </div>

      <div class="field">
        <label class="input-label">性別</label>

        <div class="sex-buttons">

          <button
            class="sex-button ${dogInfo.sex === "男の子" ? "active" : ""}"
            id="maleButton"
            type="button"
          >
            男の子
          </button>

          <button
            class="sex-button ${dogInfo.sex === "女の子" ? "active" : ""}"
            id="femaleButton"
            type="button"
          >
            女の子
          </button>

        </div>
      </div>

      <div class="field">
        <label class="input-label">生年月日</label>

        <input
          id="birthInput"
          type="date"
          value="${escapeHtml(dogInfo.birth)}"
        >
      </div>

      <div class="field">
        <label class="input-label">体重</label>

        <input
          id="weightInput"
          type="number"
          step="0.1"
          inputmode="decimal"
          placeholder="例：4.5"
          value="${escapeHtml(dogInfo.weight)}"
        >

        <div class="input-help">kg</div>
      </div>

      <div class="field">

        <label class="input-label">写真</label>

        <div class="photo-card">

          <div class="photo-preview" id="photoPreview">
            ${
              dogInfo.photo
              ? `<img src="${dogInfo.photo}" alt="わんちゃんの写真">`
              : `写真を登録してください`
            }
          </div>

          <input
            id="photoInput"
            type="file"
            accept="image/*"
            class="hidden"
          >

          <button
            class="photo-button"
            id="photoButton"
            type="button"
          >
            写真を変更
          </button>

        </div>

      </div>

    </div>

  `;

  document.getElementById("ownerInput")
    .addEventListener("input", e => {
      dogInfo.owner = e.target.value;
    });

  document.getElementById("nameInput")
    .addEventListener("input", e => {
      dogInfo.name = e.target.value;
    });

  document.getElementById("birthInput")
    .addEventListener("change", e => {
      dogInfo.birth = e.target.value;
    });

  document.getElementById("weightInput")
    .addEventListener("input", e => {
      dogInfo.weight = e.target.value;
    });

  document.getElementById("maleButton")
    .addEventListener("click", () => {

      dogInfo.sex = "男の子";

      render();

    });

  document.getElementById("femaleButton")
    .addEventListener("click", () => {

      dogInfo.sex = "女の子";

      render();

    });

  document.getElementById("photoButton")
    .addEventListener("click", () => {
      document.getElementById("photoInput").click();
    });

  document.getElementById("photoInput")
    .addEventListener("change", function(){

      const file = this.files[0];

      if(!file) return;

      const reader = new FileReader();

      reader.onload = function(e){

        dogInfo.photo = e.target.result;

        const preview =
          document.getElementById("photoPreview");

        preview.innerHTML =
          `<img src="${dogInfo.photo}" alt="わんちゃんの写真">`;

      };

      reader.readAsDataURL(file);

    });

}


/* -----------------------------
   採寸画面
----------------------------- */

function renderMeasure(app,index){

  const item = items[index];

  app.innerHTML = `

    <div class="measure-header">

      <div class="measure-number">
        ${item.no} ${index + 1} / ${items.length}
      </div>

      <h1 class="measure-title">
        ${item.title}
      </h1>

      <div class="description">
        ${item.description}
      </div>

    </div>

    ${item.locations.map((location,locationIndex) => {

      const vals =
        values[index][locationIndex];

      return `

        <div class="location-card">

          <div class="location-title">
            測定箇所：${location}
          </div>

          <div class="measure-input-row">

            ${[0,1,2].map(n => `

              <div class="measure-input">

                <input
                  type="number"
                  step="0.1"
                  inputmode="decimal"
                  placeholder="0.0"
                  value="${escapeHtml(vals[n])}"
                  data-location="${locationIndex}"
                  data-number="${n}"
                >

                <div class="measure-label">
                  ${n + 1}回目
                </div>

                <div class="cm-label">
                  cm
                </div>

              </div>

            `).join("")}

          </div>

          <div class="average-box">

            <div class="average-label">
              平均
            </div>

            <div
              class="average-value"
              id="average-${locationIndex}"
            >
              ${calculateAverage(vals)}
            </div>

          </div>

        </div>

      `;

    }).join("")}

    <div class="notice">
      ${warningText}
    </div>

  `;

  document
    .querySelectorAll(".measure-input input")
    .forEach(input => {

      input.addEventListener("input", function(){

        const locationIndex =
          Number(this.dataset.location);

        const numberIndex =
          Number(this.dataset.number);

        values[index][locationIndex][numberIndex] =
          this.value;

        updateAverage(
          index,
          locationIndex
        );

      });

    });

}


/* -----------------------------
   平均値
----------------------------- */

function calculateAverage(arr){

  const nums = arr
    .map(v => parseFloat(v))
    .filter(v => !isNaN(v));

  if(nums.length === 0){
    return "—";
  }

  const avg =
    nums.reduce((a,b) => a + b,0) / nums.length;

  return avg.toFixed(1) + " cm";
}


function updateAverage(itemIndex,locationIndex){

  const element =
    document.getElementById(
      `average-${locationIndex}`
    );

  if(!element) return;

  element.textContent =
    calculateAverage(
      values[itemIndex][locationIndex]
    );

}

/* -----------------------------
   ナビゲーション
----------------------------- */

function updateNavigation(){

  const back =
    document.getElementById("backButton");

  const next =
    document.getElementById("nextButton");

  const progress =
    document.getElementById("progress");

  back.disabled = step === 0;

  if(step === 0){

    next.textContent = "次へ";

    next.disabled =
      !dogInfo.breed.trim() ||
      !agreed;

  }
  else if(step === 1){

    next.textContent = "採寸を始める";

    next.disabled = false;

  }
  else if(step >= 2 && step <= 16){

    next.textContent =
      step === 16
      ? "採寸完了"
      : "次へ";

    next.disabled = false;

  }
  else if(step === 17){

    next.textContent = "結果を見る";

    next.disabled = false;

  }
  else{

    next.textContent = "完了";

    next.disabled = true;

  }

  const totalSteps = 19;

  const percentage =
    Math.min(
      100,
      (step / (totalSteps - 1)) * 100
    );

  progress.style.width =
    percentage + "%";

}


/* -----------------------------
   次へ
----------------------------- */

document
  .getElementById("nextButton")
  .addEventListener("click", () => {

    if(step === 0){

      if(
        !dogInfo.breed.trim() ||
        !agreed
      ){
        return;
      }

      dogInfo.breed =
        dogInfo.breed.trim();

      step = 1;

    }
    else if(step === 1){

      saveInfo();

      step = 2;

    }
    else if(step >= 2 && step <= 16){

      step++;

    }
    else if(step === 17){

      step = 18;

    }

    render();

  });


/* -----------------------------
   戻る
----------------------------- */

document
  .getElementById("backButton")
  .addEventListener("click", () => {

    if(step <= 0){
      return;
    }

    if(step === 1){

      saveInfo();

      step = 0;

    }
    else if(step >= 2 && step <= 16){

      step--;

    }
    else if(step === 17){

      step = 16;

    }
    else if(step === 18){

      step = 17;

    }

    render();

  });


/* -----------------------------
   基本情報保存
----------------------------- */

function saveInfo(){

  const owner =
    document.getElementById("ownerInput");

  const name =
    document.getElementById("nameInput");

  const birth =
    document.getElementById("birthInput");

  const weight =
    document.getElementById("weightInput");

  if(owner){
    dogInfo.owner = owner.value;
  }

  if(name){
    dogInfo.name = name.value;
  }

  if(birth){
    dogInfo.birth = birth.value;
  }

  if(weight){
    dogInfo.weight = weight.value;
  }

}


/* -----------------------------
   HTMLエスケープ
----------------------------- */

function escapeHtml(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* -----------------------------
   初期表示
----------------------------- */

render();
