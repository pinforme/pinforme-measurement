<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PINFORME 採寸ナビ</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f7f7f5;
color:#222;
font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif
}

.app{
max-width:520px;
margin:auto;
min-height:100vh;
background:#fff
}

header{
padding:18px;
border-bottom:1px solid #eee;
position:sticky;
top:0;
background:#fff;
z-index:10
}

.brand{
font-size:20px;
font-weight:800;
letter-spacing:.12em
}

.sub{
font-size:11px;
color:#777;
margin-top:4px
}

.progress{
height:5px;
background:#eee;
border-radius:10px;
margin-top:14px;
overflow:hidden
}

.progress span{
display:block;
height:100%;
background:#222;
width:5%;
transition:.3s
}

main{
padding:24px 18px 110px
}

.step{
font-size:13px;
color:#777
}

h1{
font-size:27px;
margin:8px 0 12px;
line-height:1.4
}

.desc{
font-size:14px;
line-height:1.8;
color:#555
}

.card{
background:#f6f6f3;
padding:16px;
border-radius:14px;
margin-top:18px;
font-size:13px;
line-height:1.8
}

.point{
padding:15px 0;
border-bottom:1px solid #eee
}

.point b{
display:block;
font-size:15px;
margin-bottom:6px
}

.point span{
font-size:13px;
color:#666;
line-height:1.7
}

.agree{
display:flex;
gap:10px;
align-items:center;
margin-top:22px;
padding:15px;
background:#fafafa;
border:1px solid #eee;
border-radius:13px
}

.agree input{
width:20px;
height:20px;
margin:0;
flex:none
}

label{
display:block;
font-size:13px;
font-weight:bold;
margin-top:18px
}

input,select{
width:100%;
padding:14px;
font-size:16px;
border:1px solid #ddd;
border-radius:12px;
margin-top:7px;
background:#fff
}

.measure{
margin-top:20px
}

.measure-location{
margin-top:22px;
padding:16px;
background:#fafafa;
border:1px solid #eee;
border-radius:14px
}

.location-title{
font-size:15px;
font-weight:bold;
margin-bottom:12px
}

.measure-row{
display:flex;
align-items:center;
gap:8px;
margin:10px 0
}

.measure-row label{
width:55px;
margin:0;
font-weight:normal;
color:#666
}

.measure-row input{
font-size:21px;
text-align:right;
margin:0;
flex:1
}

.unit{
font-size:14px;
width:22px
}

.average{
margin-top:14px;
padding:13px;
border-radius:10px;
background:#fff;
border:1px solid #eee;
display:flex;
justify-content:space-between;
align-items:center
}

.average strong{
font-size:22px
}

.small{
font-size:11px;
color:#777;
line-height:1.6
}

.result-location{
padding:14px 0;
border-bottom:1px solid #eee
}

.result-location-title{
font-weight:bold;
font-size:14px;
margin-bottom:5px
}

.buttons{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:min(520px,100%);
display:flex;
gap:10px;
padding:12px 18px;
padding-bottom:calc(12px + env(safe-area-inset-bottom));
background:rgba(255,255,255,.97);
border-top:1px solid #eee
}

button{
border:0;
border-radius:13px;
padding:15px;
font-size:15px;
font-weight:bold
}

.back{
flex:1;
background:#eee;
color:#222
}

.next{
flex:2;
background:#222;
color:#fff
}

.next:disabled{
opacity:.35
}
</style>
</head>

<body>

<div class="app">

<header>
<div class="brand">PINFORME</div>
<div class="sub">Miniature Pinscher　採寸ナビ｜スマホ版</div>
<div class="progress">
<span id="progress"></span>
</div>
</header>

<main id="main"></main>

<div class="buttons">
<button class="back" id="back">戻る</button>
<button class="next" id="next">確認しました →</button>
</div>

</div>


<script>

/* =========================
   採寸項目
========================= */

const items=[

{
title:"首まわり（首の付け根）",
desc:"首の付け根を一周測ります。",
locations:["首の付け根を一周"]
},

{
title:"胴まわり",
desc:"一番胸が張っているポイントを一周測ります。前脚の脇あたりから2〜3cm後ろが目安です。",
locations:["胸が一番張っている部分を一周"]
},

{
title:"ウェスト",
desc:"胴体で一番細い部分を一周測ります。",
locations:["一番細い部分を一周"]
},

{
title:"着丈",
desc:"首まわりを測った位置から尻尾の付け根までを測ります。",
locations:["首まわりの位置 → 尻尾の付け根"]
},

{
title:"前身頃",
desc:"首まわりの位置から、お腹側へ服をかぶせたい位置までを測ります。",
locations:["首まわりの位置 → お腹側"]
},

{
title:"前脚の太さ",
desc:"前脚の太い部分と細い部分を測ります。",
locations:[
"太い部分",
"細い部分"
]
},

{
title:"後脚の太さ",
desc:"後脚の太い部分と細い部分を測ります。",
locations:[
"太い部分",
"細い部分"
]
},

{
title:"前脚の長さ",
desc:"脇から関節ごとに地面までを測ります。",
locations:[
"脇 → 肘",
"肘 → 手首",
"手首 → 地面"
]
},

{
title:"後脚の長さ",
desc:"後脚の付け根から関節ごとに地面までを測ります。",
locations:[
"付け根 → 膝",
"膝 → 足首",
"足首 → 地面"
]
},

{
title:"首の長さ（ネック）",
desc:"首まわりの位置から後頭部に入る手前までを測ります。",
locations:[
"首まわりの位置 → 後頭部手前"
]
},

{
title:"首の長さ（スヌード）",
desc:"首まわりの位置から額までを測ります。",
locations:[
"首まわりの位置 → 額"
]
},

{
title:"頭周り",
desc:"額を通って頭を一周測ります。",
locations:[
"額を通って頭を一周"
]
},

{
title:"前脚の幅",
desc:"犬を前から見たときの左右の前脚の間の幅を測ります。",
locations:[
"左右の前脚の間"
]
},

{
title:"首の真ん中",
desc:"首の中で一番細い部分を測ります。",
locations:[
"首の一番細い部分を一周"
]
},

{
title:"尻尾の太さ",
desc:"尻尾の付け根の一番太い部分を測ります。",
locations:[
"尻尾の付け根の一番太い部分を一周"
]
}

];


/* =========================
   大切な6つのポイント
========================= */

const points=[

[
"❶ 採寸は最低3回は測る事",
"犬は動きますので、一度の採寸では確かな数字ではありません。できるだけ同じ場所を最低3回測り、安定した数値を確認しましょう。"
],

[
"❷ 測る際の立たせている場所",
"柔らかいソファーやクッション、ベッドなどの上では体が歪み、正しい採寸ができません。だからといって、フローリングで脚が滑りやすい状態も問題です。フローリングの上に滑り止めとして、薄手のブランケットやバスタオルなどを敷いて採寸してください。"
],

[
"❸ 測る際の愛犬の体調",
"寝起きではないですか？寝ていた直後は体が縮こまっている可能性があります。また、すぐに伏せをしてしまったり、怖がっていたりしていませんか？ついつい暴れないように高い所で測ろうとしてしまいたくなりますが、体も強張り、正確な数字とは言えません。寒くて震えていませんか？これもまた体が強張り、正確な数字とは言えません。疲れていませんか？怪我や、普段しないような行動をする可能性もあります。コンディションが悪いと採寸を嫌がりますので、避けましょう。"
],

[
"❹ 測る際の体勢",
"採寸時の犬の体勢をしっかり確認しましょう。4本の脚で立ち、まっすぐ前を見ている状態にします。何かを覗き込むように首を伸ばしたり、へっぴり腰になったり、お座りしたり、伏せたりしていない状態を作りましょう。伏せた状態やお座りした状態では、それぞれ数字が変わり、正しい採寸ができません。リラックスした自然な体勢がベストです。"
],

[
"❺ 独自の体型を理解する",
"お尻にかけてカーブが強い、胸板が厚い、前脚の間隔がとても広いなど、特徴的な体型の場合は、その特徴を意識して採寸しましょう。"
],

[
"❻ 呼吸を感じる",
"呼吸と共に1.0cmから1.5cmほど、採寸時のサイズに変化が出ます。興奮状態ですと特に呼吸が大きくなるため、採寸に誤差が生じます。できる限り落ち着いた状態で採寸することがベストですが、大抵の犬はメジャーを少し怖がり、呼吸が大きくなります。ですので、呼吸を感じながら数字を読み取りましょう。"
]

];


/* =========================
   データ
========================= */

let step=0;
let agreed=false;

let dogInfo={
name:"",
sex:"",
birth:"",
weight:""
};

/*
  各項目
  各測定場所
  1回目・2回目・3回目
*/

let values=items.map(item =>
item.locations.map(location => ["","",""])
);


/* =========================
   要素
========================= */

const main=document.getElementById("main");
const next=document.getElementById("next");
const back=document.getElementById("back");
const progress=document.getElementById("progress");


/* =========================
   画面表示
========================= */

function render(){

progress.style.width=
(((step+1)/(items.length+3))*100)+"%";


if(step===0){
renderPoints();
return;
}

if(step===1){
renderInfo();
return;
}

if(step>=2 && step<=items.length+1){
renderMeasure(step-2);
return;
}

renderFinish();

}


/* =========================
   6つのポイント
========================= */

function renderPoints(){

main.innerHTML=`

<div class="step">WELCOME</div>

<h1>
採寸前に<br>
大切な6つのポイント
</h1>

<p class="desc">
正確な採寸と、わんちゃんの安全のために、
まずこちらをご確認ください。
</p>

${points.map(p=>`

<div class="point">

<b>${p[0]}</b>

<span>${p[1]}</span>

</div>

`).join("")}


<div class="agree">

<input type="checkbox" id="agree">

<label for="agree" style="margin:0;font-weight:normal">

6つのポイントを確認し、内容に同意します

</label>

</div>

`;

next.textContent="同意して入力画面へ →";
next.disabled=true;
back.disabled=true;


document.getElementById("agree").onchange=e=>{

agreed=e.target.checked;

next.disabled=!agreed;

};

}


/* =========================
   わんちゃん情報
========================= */

function renderInfo(){

main.innerHTML=`

<div class="step">START</div>

<h1>わんちゃん情報</h1>

<p class="desc">
まずは基本情報を入力してください。
</p>


<label>わんちゃんのお名前</label>

<input
id="name"
value="${dogInfo.name}"
placeholder="例：PINちゃん"
>


<label>性別</label>

<select id="sex">

<option value="">選択してください</option>

<option ${dogInfo.sex==="オス"?"selected":""}>
オス
</option>

<option ${dogInfo.sex==="メス"?"selected":""}>
メス
</option>

</select>


<label>生年月日</label>

<input
id="birth"
type="date"
value="${dogInfo.birth}"
>


<label>体重（kg）</label>

<input
id="weight"
inputmode="decimal"
value="${dogInfo.weight}"
placeholder="例：3.2"
>


<div class="card">

<b>採寸時の注意点</b>

<br><br>

・わんちゃんがリラックスした状態で測定してください。

<br><br>

・メジャーは体に沿わせ、きつすぎず、ゆるすぎないように測ってください。

<br><br>

・毛の長さによって数値が変わるため、できるだけ毛をおさえた状態で測定してください。

<br><br>

・分からない場合は、無理に測らず、空欄のままで構いません。

</div>

`;

next.textContent="採寸スタート →";
next.disabled=false;
back.disabled=false;


/* 入力内容を保持 */

document.getElementById("name").oninput=e=>{
dogInfo.name=e.target.value;
};

document.getElementById("sex").onchange=e=>{
dogInfo.sex=e.target.value;
};

document.getElementById("birth").oninput=e=>{
dogInfo.birth=e.target.value;
};

document.getElementById("weight").oninput=e=>{
dogInfo.weight=e.target.value;
};

}


/* =========================
   採寸画面
========================= */

function renderMeasure(i){

const item=items[i];

main.innerHTML=`

<div class="step">
STEP ${i+1} / ${items.length}
</div>

<h1>
${i+1}. ${item.title}
</h1>

<p class="desc">
${item.desc}
</p>

<div class="card">

📏 <b>測るポイント</b>

<br><br>

${item.locations.map((location,index)=>
`${index+1}. ${location}<br>`
).join("")}

<br>

できるだけ毛をおさえ、
自然な状態で測定してください。

</div>


<div class="measure">

${item.locations.map((location,locationIndex)=>`

<div class="measure-location">

<div class="location-title">

${locationIndex+1}. ${location}

</div>


${[0,1,2].map(n=>`

<div class="measure-row">

<label>${n+1}回目</label>

<input
class="m"
data-location="${locationIndex}"
data-number="${n}"
inputmode="decimal"
value="${values[i][locationIndex][n]}"
placeholder="0.0"
>

<span class="unit">cm</span>

</div>

`).join("")}


<div class="average">

<span>平均値</span>

<strong id="avg-${locationIndex}">—</strong>

<span class="unit">cm</span>

</div>

<div
class="small"
id="status-${locationIndex}"
>
3回測ると平均値を表示します。
</div>

</div>

`).join("")}

</div>

`;


document.querySelectorAll(".m").forEach(input=>{

input.oninput=()=>{

const locationIndex=
Number(input.dataset.location);

const number=
Number(input.dataset.number);

values[i][locationIndex][number]=input.value;

calc(i,locationIndex);

};

});


item.locations.forEach((_,locationIndex)=>{

calc(i,locationIndex);

});


next.textContent=
i===items.length-1
?"結果を確認 →"
:"次へ →";

next.disabled=false;

}


/* =========================
   平均計算
========================= */

function calc(i,locationIndex){

const a=
values[i][locationIndex]
.map(Number)
.filter(n=>Number.isFinite(n)&&n>0);


let avg="—";

if(a.length){

avg=
(a.reduce((s,n)=>s+n,0)/a.length)
.toFixed(1);

}


const avgElement=
document.getElementById(
`avg-${locationIndex}`
);

const statusElement=
document.getElementById(
`status-${locationIndex}`
);


if(avgElement){
avgElement.textContent=avg;
}


if(statusElement){

if(a.length===3){

statusElement.textContent=
"3回の平均値を表示しています。";

}else{

statusElement.textContent=
`${a.length}回入力済み（最低3回がおすすめ）`;

}

}

}


/* =========================
   結果画面
========================= */

function renderFinish(){

main.innerHTML=`

<div class="step">
FINISH
</div>

<h1>
採寸結果
</h1>

<p class="desc">
入力した結果を確認してください。
</p>


<div class="card">

<b>わんちゃん情報</b>

<br><br>

名前：${dogInfo.name || "未入力"}<br>

性別：${dogInfo.sex || "未入力"}<br>

生年月日：${dogInfo.birth || "未入力"}<br>

体重：${dogInfo.weight ? dogInfo.weight+" kg" : "未入力"}

</div>


${items.map((item,i)=>`

<div class="card">

<b>
${i+1}. ${item.title}
</b>

${item.locations.map((location,locationIndex)=>{

const a=
values[i][locationIndex]
.map(Number)
.filter(n=>Number.isFinite(n)&&n>0);

const avg=
a.length
?(a.reduce((s,n)=>s+n,0)/a.length).toFixed(1)
:"未入力";


return `

<div class="result-location">

<div class="result-location-title">

${location}

</div>

<div>

平均：
<b>${avg}${avg==="未入力"?"":" cm"}</b>

</div>

<div class="small">

${a.length}回測定

</div>

</div>

`;

}).join("")}

</div>

`).join("")}


<div class="card">

採寸結果は現在この画面上でのみ表示されています。
入力データは外部へ送信・保存していません。

</div>

`;

next.textContent="最初に戻る";
next.disabled=false;

}


/* =========================
   次へ
========================= */

next.onclick=()=>{

/* 6つのポイント */

if(step===0 && agreed){

step=1;

render();

return;

}


/* それ以外 */

if(step < items.length+2){

/* わんちゃん情報から採寸へ */

if(step===1){

dogInfo.name=
document.getElementById("name")?.value || "";

dogInfo.sex=
document.getElementById("sex")?.value || "";

dogInfo.birth=
document.getElementById("birth")?.value || "";

dogInfo.weight=
document.getElementById("weight")?.value || "";

}

step++;

render();

}else{

/* 最初に戻る */

step=0;

agreed=false;

values=items.map(item =>
item.locations.map(location => ["","",""])
);

dogInfo={
name:"",
sex:"",
birth:"",
weight:""
};

render();

}

};


/* =========================
   戻る
========================= */

back.onclick=()=>{

if(step>0){

/* 情報画面から戻る */

if(step===2){

dogInfo.name=
document.getElementById("name")?.value || "";

dogInfo.sex=
document.getElementById("sex")?.value || "";

dogInfo.birth=
document.getElementById("birth")?.value || "";

dogInfo.weight=
document.getElementById("weight")?.value || "";

}

step--;

render();

}

};


/* =========================
   初期表示
========================= */

render();

</script>

</body>
</html>
