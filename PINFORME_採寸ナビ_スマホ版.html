<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PINFORME 採寸ナビ</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#f7f7f5;
color:#222;
font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif
}
.app{
max-width:520px;
margin:auto;
min-height:100vh;
background:#fff
}
header{
padding:20px;
border-bottom:1px solid #eee;
position:sticky;
top:0;
background:#fff;
z-index:10
}
.brand{
font-size:20px;
font-weight:800;
letter-spacing:.12em
}
.sub{
font-size:11px;
color:#777;
margin-top:5px
}
main{
padding:24px 18px 110px
}
.step{
font-size:13px;
color:#777
}
h1{
font-size:27px;
margin:8px 0
}
.desc{
font-size:14px;
line-height:1.8;
color:#555
}
.card{
background:#f6f6f3;
padding:16px;
border-radius:14px;
margin-top:20px;
line-height:1.7;
font-size:13px
}
label{
display:block;
font-size:13px;
font-weight:bold;
margin-top:18px
}
input,select{
width:100%;
padding:14px;
font-size:16px;
border:1px solid #ddd;
border-radius:12px;
margin-top:7px;
background:white
}
.buttons{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:min(520px,100%);
padding:12px 18px;
background:white;
border-top:1px solid #eee
}
button{
width:100%;
border:0;
border-radius:13px;
padding:16px;
background:#222;
color:white;
font-size:16px;
font-weight:bold
}
</style>
</head>

<body>

<div class="app">

<header>
<div class="brand">PINFORME</div>
<div class="sub">Miniature Pinscher　採寸ナビ｜スマホ版</div>
</header>

<main>

<div class="step">START</div>

<h1>わんちゃん情報</h1>

<p class="desc">
まずは基本情報を入力してください。
</p>

<label>わんちゃんのお名前</label>
<input id="name" placeholder="例：PINちゃん">

<label>性別</label>
<select id="sex">
<option value="">選択してください</option>
<option>オス</option>
<option>メス</option>
</select>

<label>生年月日</label>
<input id="birth" type="date">

<label>体重（kg）</label>
<input id="weight" inputmode="decimal" placeholder="例：3.2">

<div class="card">
📏 採寸するときのポイント<br><br>
・わんちゃんを4本脚で自然に立たせる<br>
・メジャーをきつく締めすぎない<br>
・できるだけ毛をおさえて測る<br>
・分からない項目は無理に測らない
</div>

</main>

<div class="buttons">
<button onclick="start()">採寸スタート →</button>
</div>

</div>

<script>
function start(){
alert("採寸スタート！\n次の画面を作成できます。");
}
</script>

</body>
</html>
