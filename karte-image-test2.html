    ["❻ 呼吸を感じる", "呼吸と共に1.0cmから1.5cmは採寸じのサイズに変化が出ます。興奮状態ですと特に呼吸が大きくなるので採寸に誤差が生じます。できる限り落ち着いて状態で採寸することがベストですが大抵の犬はメジャーを少し怖がり呼吸が大きくなります。ですので呼吸を感じながら数字を読みます。"]
  ],
  history: [
    ["2026/11/05", "△1 再採寸：胴まわり・着丈・前身頃", "胴まわり 34.3 cm → 34.8 cm／前身頃は新基準（みぞおち）で 16.0 cm"]
  ]
};

function loadImage(src){ return new Promise((res, rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = rej; i.src = src; }); }
function wrapLines(c, text, maxWidth){
  const lines = []; let line = "";
  for(const ch of text){
    if(c.measureText(line + ch).width > maxWidth && line){ lines.push(line); line = ch; }
    else line += ch;
  }
  if(line) lines.push(line);
  return lines;
}

async function renderKarte(){
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  const X = v => v * S;
  c.fillStyle = '#ffffff'; c.fillRect(0, 0, W, H);
  c.fillStyle = '#222'; c.strokeStyle = '#999'; c.lineWidth = 1 * S;

  /* ロゴ */
  try{ c.letterSpacing = (4*S) + 'px'; }catch(e){}
  c.fillStyle = '#222'; c.font = '800 ' + X(29) + 'px ' + FONT;
  c.fillText('PINFORME', X(30), X(56));
  try{ c.letterSpacing = (3*S) + 'px'; }catch(e){}
  c.font = '400 ' + X(8) + 'px ' + FONT;
  c.fillText('DOG WEAR MEASUREMENT KARTE', X(30), X(70));
  try{ c.letterSpacing = '0px'; }catch(e){}
  /* 犬種 */
  c.font = '700 ' + X(14) + 'px ' + FONT;
  c.fillText(D.breed, X(30), X(100));

  /* v2 purpose */
  c.strokeStyle = '#bbb'; c.beginPath(); c.moveTo(X(30), X(112)); c.lineTo(X(515), X(112)); c.stroke();
  c.fillStyle = '#222'; c.font = '400 ' + X(10) + 'px ' + FONT;
  c.fillText(D.purpose1, X(30), X(130));
  c.fillText(D.purpose2, X(30), X(147));

  /* 測定箇所 */
  c.font = '800 ' + X(13) + 'px ' + FONT;
  c.fillText('測定箇所', X(30), X(172));
  const diagram = await loadImage(DIAGRAM_SRC);
  const bx = 30, by = 180, bw = 485, bh = 175;
  c.strokeStyle = '#bbb'; c.strokeRect(X(bx), X(by), X(bw), X(bh));
  const pad = 10, iw2 = bw - pad*2, ih2 = bh - pad*2;
  const dsc = Math.min(iw2/diagram.width, ih2/diagram.height);
  c.drawImage(diagram, X(bx + pad) + (X(iw2) - diagram.width*dsc*S)/2, X(by + pad) + (X(ih2) - diagram.height*dsc*S)/2, diagram.width*dsc*S, diagram.height*dsc*S);

  /* 基本情報 */
  const ix = 550, iy = 52, iw = 540, ih = 218;
  c.strokeStyle = '#999'; c.strokeRect(X(ix), X(iy), X(iw), X(ih));
  c.fillStyle = '#222'; c.font = '800 ' + X(12) + 'px ' + FONT;
  c.fillText('基本情報', X(ix+8), X(iy+20));
  c.strokeStyle = '#aaa'; c.beginPath(); c.moveTo(X(ix), X(iy+27)); c.lineTo(X(ix+iw), X(iy+27)); c.stroke();
  const photo = await loadImage(PHOTO_SRC);
  const pw = 190, ph = 191, px = ix + iw - pw, py = iy + 27;
  c.save(); c.beginPath(); c.rect(X(px), X(py), X(pw), X(ph)); c.clip();
  const psc = Math.max(pw/photo.width, ph/photo.height);
  c.drawImage(photo, X(px) + (X(pw) - photo.width*psc*S)/2, X(py) + (X(ph) - photo.height*psc*S)/2, photo.width*psc*S, photo.height*psc*S);
  c.restore();
  c.strokeStyle = '#bbb'; c.strokeRect(X(px), X(py), X(pw), X(ph));
  const rowsY = iy + 27, rowH = 191/6;
  D.fields.forEach((f, i)=>{
    const y = rowsY + i*rowH;
    if(i > 0){ c.strokeStyle = '#bbb'; c.beginPath(); c.moveTo(X(ix), X(y)); c.lineTo(X(px), X(y)); c.stroke(); }
    c.fillStyle = '#555'; c.font = '400 ' + X(9) + 'px ' + FONT;
    c.fillText(f[0], X(ix+10), X(y + rowH/2 + 3));
    c.fillStyle = '#222'; c.font = '700 ' + X(11) + 'px ' + FONT;
    c.fillText(f[1], X(ix+145), X(y + rowH/2 + 4));
  });

  /* 6つのポイント */
  const tx = 550, tw = 540;
  c.fillStyle = '#222'; c.font = '800 ' + X(16) + 'px ' + FONT;
  c.fillText('採寸前に大切な6つのポイント', X(tx+8), X(307));
  c.strokeStyle = '#aaa'; c.beginPath(); c.moveTo(X(tx), X(316)); c.lineTo(X(tx+tw), X(316)); c.stroke();
  let yy = 330;
  for(const pt of D.points){
    c.fillStyle = '#222'; c.font = '700 ' + X(9) + 'px ' + FONT;
    c.fillText(pt[0], X(tx+8), X(yy + 9)); yy += 12;
    c.font = '400 ' + X(6.6) + 'px ' + FONT; c.fillStyle = '#333';
    for(const ln of wrapLines(c, pt[1], X(tw - 16))){
      c.fillText(ln, X(tx+8), X(yy + 7)); yy += 8.25;
    }
    yy += 5;
  }
  c.strokeStyle = '#aaa'; c.beginPath(); c.moveTo(X(tx), X(yy + 2)); c.lineTo(X(tx+tw), X(yy + 2)); c.stroke();

  /* 更新履歴（ポイントの下に配置） */
  const hx = 550, hy = yy + 14, hw = 540;
  c.strokeStyle = '#999'; c.strokeRect(X(hx), X(hy), X(hw), X(64));
  c.fillStyle = '#222'; c.font = '800 ' + X(11) + 'px ' + FONT;
  c.fillText('更新履歴（直近3回）', X(hx+8), X(hy+18));
  c.strokeStyle = '#aaa'; c.beginPath(); c.moveTo(X(hx), X(hy+24)); c.lineTo(X(hx+hw), X(hy+24)); c.stroke();
  D.history.forEach((h, i)=>{
    const y = hy + 24 + i*38;
    c.fillStyle = '#222'; c.font = '700 ' + X(10) + 'px ' + FONT;
    c.fillText(h[0], X(hx+8), X(y+17));
    c.font = '400 ' + X(10) + 'px ' + FONT;
    c.fillText(h[1], X(hx+100), X(y+17));
    c.fillStyle = '#555'; c.font = '400 ' + X(9) + 'px ' + FONT;
    c.fillText(h[2], X(hx+100), X(y+32));
  });

  /* 採寸結果 */
  c.fillStyle = '#222'; c.font = '800 ' + X(15) + 'px ' + FONT;
  c.fillText('採寸結果（3回の平均値）', X(30), X(368));
  c.font = '400 ' + X(9) + 'px ' + FONT; c.fillStyle = '#555';
  c.fillText('△ 改定番号 ／ ＋ 追加 ／ ↻ 再採寸（直近3回）', X(215), X(368));
  const gx = 30, gy = 380, cw = 485/3, ch = 76;
  c.strokeStyle = '#999';
  D.cells.forEach((cell, i)=>{
    const col = i % 3, row = Math.floor(i/3);
    const x = gx + col*cw, y = gy + row*ch;
    c.strokeRect(X(x), X(y), X(cw), X(ch));
    c.fillStyle = '#222'; c.font = '700 ' + X(9) + 'px ' + FONT;
    c.fillText(cell[0], X(x+8), X(y+16));
    c.fillStyle = '#555'; c.font = '400 ' + X(6.2) + 'px ' + FONT;
    const whereLines = wrapLines(c, cell[1], X(cw - 16)).slice(0, 2);
    whereLines.forEach((ln, li)=> c.fillText(ln, X(x+8), X(y+28 + li*8)));
    const vals = cell[2];
    const vw = (cw - 12) / vals.length;
    vals.forEach((v, vi)=>{
      const vx = x + 6 + vi*vw;
      const isNum = v[0] !== '未測定';
      c.fillStyle = isNum ? '#222' : '#999'; c.font = '700 ' + X(10) + 'px ' + FONT;
      c.textAlign = 'center';
      c.fillText(v[0] + (v[2] ? ' ' + v[2] : ''), X(vx + vw/2), X(y+56));
      c.textAlign = 'left';
      c.strokeStyle = '#aaa'; c.beginPath(); c.moveTo(X(vx+2), X(y+62)); c.lineTo(X(vx+vw-2), X(y+62)); c.stroke();
      if(v[1]){ c.fillStyle = '#888'; c.font = '400 ' + X(6.5) + 'px ' + FONT; c.textAlign = 'right'; c.fillText(v[1], X(vx+vw-2), X(y+72)); c.textAlign = 'left'; }
    });
  });
  return cv;
}

const status = document.getElementById('status');
document.getElementById('genBtn').addEventListener('click', async ()=>{
  status.textContent = '生成中…';
  try{
    const cv = await renderKarte();
    const pngBlob = await new Promise(res => cv.toBlob(res, 'image/png'));
    if(!pngBlob){ status.textContent = '生成に失敗しました（PNG化できませんでした）。'; return; }
    const url = URL.createObjectURL(pngBlob);
    const img = document.getElementById('preview');
    img.src = url; img.style.display = 'block';
    const shareBtn = document.getElementById('shareBtn');
    const dlBtn = document.getElementById('dlBtn');
    dlBtn.disabled = false;
    const file = new File([pngBlob], 'pinforme-karte.png', {type:'image/png'});
    const canShareFiles = !!(navigator.canShare && navigator.canShare({files:[file]}));
    shareBtn.disabled = !canShareFiles;
    status.textContent = '生成できました。サイズ: ' + cv.width + '×' + cv.height + 'px ／ ' + Math.round(pngBlob.size/1024) + 'KB\n共有での保存: ' + (canShareFiles ? 'この端末は対応しています' : 'この端末は未対応です（画像を長押しして保存してください）');
    shareBtn.onclick = async ()=>{ try{ await navigator.share({files:[file]}); }catch(e){} };
    dlBtn.onclick = ()=>{ const a = document.createElement('a'); a.href = url; a.download = 'pinforme-karte.png'; a.click(); };
  }catch(e){
    status.textContent = '生成に失敗しました: ' + e.message;
  }
});
</script>
